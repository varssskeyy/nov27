<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BlinkView — Balcony to Twilight Beach Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      background: #050608;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8f5f0;
    }

    #scene-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      background: #050608;
    }

    #three-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
    #three-container.candle-hover {
      cursor: pointer;
    }

    #balcony-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    #balcony-layer canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 46%,
        rgba(0, 0, 0, 0) 56%,
        rgba(8, 10, 14, 0.22) 86%,
        rgba(4, 6, 10, 0.45) 100%
      );
      z-index: 6;
    }

    #blink-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 35;
      pointer-events: none;
    }

    /* Mobile Floating Translucent Thumb Joystick (Bottom-Left) */
    #mobile-joystick {
      position: fixed;
      left: max(18px, calc(env(safe-area-inset-left) + 14px));
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 18px));
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 232, 194, 0.28);
      background: radial-gradient(circle at 50% 50%, rgba(255, 236, 204, 0.08), rgba(14, 12, 22, 0.42));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.36);
      z-index: 22;
      touch-action: none;
      display: none;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #mobile-joystick.visible {
      display: block;
      opacity: 1;
      transform: scale(1);
    }
    #joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin-left: -20px;
      margin-top: -20px;
      border-radius: 50%;
      border: 1px solid rgba(255, 238, 206, 0.65);
      background: radial-gradient(circle at 35% 35%, rgba(255, 232, 185, 0.85), rgba(255, 184, 102, 0.42));
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 198, 118, 0.28);
      pointer-events: none;
      transform: translate3d(0, 0, 0);
    }

    /* Minimal Frosted-Glass Prompts (Stage 6, Stage 7, Stage 8 only) */
    #ui-stage-wrap {
      position: fixed;
      left: 50%;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 14px));
      transform: translateX(-50%);
      z-index: 24;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(90vw, 540px);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      pointer-events: none;
    }
    @media (max-width: 720px) {
      #ui-stage-wrap.with-joystick {
        bottom: max(128px, calc(env(safe-area-inset-bottom) + 122px));
      }
    }

    .action-pill {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 14px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 228, 184, 0.46);
      background: rgba(18, 14, 24, 0.68);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.48), 0 0 28px rgba(255, 184, 92, 0.24);
      color: #fff8ee;
      font-size: clamp(14.5px, 3.8vw, 16px);
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .action-pill.visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    .action-pill:hover {
      background: rgba(34, 24, 42, 0.82);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.54), 0 0 36px rgba(255, 198, 114, 0.38);
      transform: translateY(-1px);
    }

    .mic-meter-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      width: 170px;
    }
    .mic-meter-wrap.active {
      display: flex;
    }
    .mic-track {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }
    #mic-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffbd59, #ffe7a8);
      transition: width 0.06s linear;
    }

    /* Stage 8: VAREN Romantic Dialogue Card */
    #dialogue-card {
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 22px;
      border: 1px solid rgba(255, 228, 188, 0.32);
      background: rgba(14, 12, 24, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    #dialogue-card.visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }
    .dialogue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #ffcf7d;
    }
    #dialogue-text {
      font-size: clamp(14.5px, 3.8vw, 16px);
      line-height: 1.55;
      color: #fdf7ef;
      min-height: 48px;
    }
    .dialogue-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #dialogue-count {
      font-size: 11.5px;
      color: rgba(255, 236, 210, 0.62);
    }
    #btn-dialogue-next {
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(255, 222, 168, 0.46);
      background: linear-gradient(135deg, rgba(255, 190, 92, 0.36), rgba(255, 138, 172, 0.32));
      color: #fff9f0;
      font-size: clamp(14px, 3.6vw, 15.5px);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    #btn-dialogue-next:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(255, 198, 108, 0.52), rgba(255, 152, 184, 0.46));
    }

    /* Final Double-Blink Birthday Reveal Screen */
    #finale-overlay {
      position: fixed;
      inset: 0;
      z-index: 28;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(24px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(98px, calc(env(safe-area-inset-bottom) + 84px)) max(22px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 44%, #251a3d 0%, #120d22 48%, #06060d 100%);
      overflow: hidden;
    }
    #finale-overlay.visible {
      display: flex;
    }
    #finale-bokeh {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .finale-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 920px;
      padding: 0 10px;
    }
    #finale-handwritten-svg {
      width: min(94vw, 820px);
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 0 26px rgba(255, 196, 108, 0.36)) drop-shadow(0 8px 24px rgba(0, 0, 0, 0.62));
    }
    .hw-text {
      font-family: 'Great Vibes', 'Brush Script MT', cursive;
      font-weight: 400;
      stroke: url(#goldInkGrad);
      fill: url(#goldInkGrad);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hw-line-1 { font-size: 98px; }
    .hw-line-2 { font-size: 132px; }
    #finale-subtitle {
      font-size: clamp(1rem, 3.8vw, 1.38rem);
      line-height: 1.55;
      color: rgba(255, 240, 220, 0.90);
      max-width: 560px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #btn-finale-replay {
      position: fixed;
      left: 50%;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
      transform: translateX(-50%);
      z-index: 3;
      min-height: 48px;
      padding: 13px 30px;
      border-radius: 999px;
      border: 1px solid rgba(255, 224, 174, 0.48);
      background: rgba(22, 16, 32, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff6e8;
      font-size: clamp(14px, 3.6vw, 15.5px);
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      opacity: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42), 0 0 22px rgba(255, 188, 98, 0.20);
      transition: opacity 0.5s ease, background 0.2s ease, transform 0.2s ease;
    }
    #btn-finale-replay:hover {
      background: rgba(38, 28, 54, 0.84);
      transform: translateX(-50%) translateY(-1px);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene-viewport">
    <div id="three-container"></div>

    <div id="balcony-layer">
      <canvas id="gl-backdrop"></canvas>
      <canvas id="fg-canvas"></canvas>
      <div id="vignette"></div>
    </div>

    <div id="mobile-joystick" aria-label="Walk Joystick">
      <div id="joy-knob"></div>
    </div>

    <div id="ui-stage-wrap">
      <!-- Stage 6: Blow Out the Candle -->
      <button id="btn-blow" class="action-pill" type="button">
        <span id="blow-label">Blow Out the Candle</span>
        <span id="mic-meter-wrap" class="mic-meter-wrap">
          <span class="mic-track"><span id="mic-bar"></span></span>
        </span>
      </button>

      <!-- Stage 7: Cut the Cake -->
      <button id="btn-cut" class="action-pill" type="button">
        <span>Cut the Cake</span>
      </button>

      <!-- Stage 8: VAREN Dialogue Card -->
      <div id="dialogue-card" role="dialog" aria-label="VAREN Birthday Message">
        <div class="dialogue-header">
          <span>VAREN</span>
          <span id="dialogue-count">1 / 4</span>
        </div>
        <div id="dialogue-text"></div>
        <div class="dialogue-footer">
          <span style="font-size:11.5px; color:rgba(255,236,210,0.50);">Drag to look • Walk beach</span>
          <button id="btn-dialogue-next" type="button">Next</button>
        </div>
      </div>
    </div>

    <!-- Final Double-Blink Handwritten Celebration Reveal -->
    <div id="finale-overlay" aria-live="polite">
      <canvas id="finale-bokeh"></canvas>
      <div class="finale-content">
        <svg id="finale-handwritten-svg" viewBox="0 0 680 340" aria-label="Birthday Celebration Title">
          <defs>
            <linearGradient id="goldInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fffef6" />
              <stop offset="48%" stop-color="#ffe5a3" />
              <stop offset="100%" stop-color="#ffae63" />
            </linearGradient>
            <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <text id="hw-line-1" class="hw-text hw-line-1" x="340" y="130" text-anchor="middle" stroke-dasharray="2200" stroke-dashoffset="2200" fill-opacity="0"></text>
          <text id="hw-line-2" class="hw-text hw-line-2" x="340" y="272" text-anchor="middle" stroke-dasharray="2200" stroke-dashoffset="2200" fill-opacity="0"></text>
        </svg>
        <p id="finale-subtitle"></p>
      </div>
      <button id="btn-finale-replay" type="button">Replay Wish</button>
    </div>

    <canvas id="blink-canvas"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // =========================================================================
    // ✏️ EDIT WISHES & FINAL BIRTHDAY TEXT HERE
    // =========================================================================
    const FINAL_BIRTHDAY_TITLE = "Happy Birthday Varsh";
    const FINAL_BIRTHDAY_SUBTITLE = "May your year shine brighter than tonight's sky ✨";

    const VAREN_DIALOGUE_LINES = [
      "Hi Varsh, I'm VAREN. I brought you a quiet little twilight beach for your birthday.",
      "Even the sun and moon showed up together tonight just to celebrate you.",
      "Happy Birthday, Varsh. May this year bring you calm days, warm laughs, and everything you're hoping for.",
      "I'll see you in the stars—have a wonderful birthday!"
    ];

    // =========================================================================
    // 1. DETERMINISTIC NOISE & MATH HELPERS
    // =========================================================================
    function makeRng(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function hash2D(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, y) {
      const ix = Math.floor(x);
      const iy = Math.floor(y);
      const fx = x - ix;
      const fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2D(ix, iy);
      const b = hash2D(ix + 1, iy);
      const c = hash2D(ix, iy + 1);
      const d = hash2D(ix + 1, iy + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    }

    function fbm2D(x, y, octaves = 4) {
      let value = 0;
      let amp = 0.5;
      let freq = 1.0;
      for (let i = 0; i < octaves; i++) {
        value += amp * valueNoise2D(x * freq, y * freq);
        freq *= 2.03;
        amp *= 0.5;
      }
      return value;
    }

    function smooth01(t) {
      const c = Math.max(0, Math.min(1, t));
      return c * c * (3 - 2 * c);
    }

    function lerpAngle(current, target, alpha) {
      let diff = ((target - current + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return current + diff * alpha;
    }

    // =========================================================================
    // 2. CURVED EYELID BLINK OVERLAY (2.5-second dreamy natural pacing)
    // =========================================================================
    const threeContainer = document.getElementById('three-container');
    const balconyLayer = document.getElementById('balcony-layer');
    const glCanvas = document.getElementById('gl-backdrop');
    const fgCanvas = document.getElementById('fg-canvas');
    const blinkCanvas = document.getElementById('blink-canvas');

    const fgCtx = fgCanvas.getContext('2d');
    const blinkCtx = blinkCanvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    let DPR = Math.min(window.devicePixelRatio || 1, 2);

    const blinkState = {
      progress: 1.0 // Starts closed in darkness for Stage 1 opening blink
    };

    function renderBlinkOverlay() {
      const cw = blinkCanvas.width;
      const ch = blinkCanvas.height;
      blinkCtx.clearRect(0, 0, cw, ch);

      const p = blinkState.progress;
      if (p <= 0.002) {
        fgCanvas.style.filter = 'none';
        glCanvas.style.filter = 'none';
        threeContainer.style.filter = 'none';
        return;
      }

      const blurPx = (p * 4.5).toFixed(2);
      const dimFilter = `blur(${blurPx}px) brightness(${(1 - p * 0.28).toFixed(3)})`;
      if (balconyLayer.style.display !== 'none') {
        fgCanvas.style.filter = dimFilter;
        glCanvas.style.filter = dimFilter;
      } else {
        threeContainer.style.filter = dimFilter;
      }

      const meetY = ch * 0.72;
      const upperY = -ch * 0.08 + p * (meetY + ch * 0.08);
      const lowerY = ch * 1.08 - p * (ch * 1.08 - meetY);
      const arch = (1 - p) * ch * 0.11;
      const feather = ch * (0.095 - p * 0.045);

      blinkCtx.save();
      blinkCtx.beginPath();
      blinkCtx.moveTo(-20, -20);
      blinkCtx.lineTo(cw + 20, -20);
      blinkCtx.lineTo(cw + 20, upperY + arch * 0.5);
      blinkCtx.quadraticCurveTo(cw * 0.5, upperY - arch, -20, upperY + arch * 0.5);
      blinkCtx.closePath();
      blinkCtx.fillStyle = '#050608';
      blinkCtx.fill();

      blinkCtx.beginPath();
      blinkCtx.moveTo(-20, upperY + arch * 0.5 - 4);
      blinkCtx.quadraticCurveTo(cw * 0.5, upperY - arch - 4, cw + 20, upperY + arch * 0.5 - 4);
      blinkCtx.lineTo(cw + 20, upperY + arch * 0.5 + feather);
      blinkCtx.quadraticCurveTo(cw * 0.5, upperY - arch + feather, -20, upperY + arch * 0.5 + feather);
      blinkCtx.closePath();
      const lashTopGrad = blinkCtx.createLinearGradient(0, upperY - arch, 0, upperY + feather);
      lashTopGrad.addColorStop(0, 'rgba(5, 6, 8, 0.96)');
      lashTopGrad.addColorStop(0.45, 'rgba(8, 10, 14, 0.52)');
      lashTopGrad.addColorStop(1, 'rgba(8, 10, 14, 0.0)');
      blinkCtx.fillStyle = lashTopGrad;
      blinkCtx.fill();
      blinkCtx.restore();

      blinkCtx.save();
      blinkCtx.beginPath();
      blinkCtx.moveTo(-20, ch + 20);
      blinkCtx.lineTo(cw + 20, ch + 20);
      blinkCtx.lineTo(cw + 20, lowerY - arch * 0.35);
      blinkCtx.quadraticCurveTo(cw * 0.5, lowerY + arch * 0.65, -20, lowerY - arch * 0.35);
      blinkCtx.closePath();
      blinkCtx.fillStyle = '#050608';
      blinkCtx.fill();

      blinkCtx.beginPath();
      blinkCtx.moveTo(-20, lowerY - arch * 0.35 + 4);
      blinkCtx.quadraticCurveTo(cw * 0.5, lowerY + arch * 0.65 + 4, cw + 20, lowerY - arch * 0.35 + 4);
      blinkCtx.lineTo(cw + 20, lowerY - arch * 0.35 - feather * 0.85);
      blinkCtx.quadraticCurveTo(cw * 0.5, lowerY + arch * 0.65 - feather * 0.85, -20, lowerY - arch * 0.35 - feather * 0.85);
      blinkCtx.closePath();
      const lashBotGrad = blinkCtx.createLinearGradient(0, lowerY + arch * 0.6, 0, lowerY - feather * 0.85);
      lashBotGrad.addColorStop(0, 'rgba(5, 6, 8, 0.96)');
      lashBotGrad.addColorStop(0.45, 'rgba(8, 10, 14, 0.48)');
      lashBotGrad.addColorStop(1, 'rgba(8, 10, 14, 0.0)');
      blinkCtx.fillStyle = lashBotGrad;
      blinkCtx.fill();
      blinkCtx.restore();

      if (p > 0.88) {
        const alpha = Math.min(1, (p - 0.88) / 0.11);
        blinkCtx.fillStyle = `rgba(4, 5, 7, ${alpha})`;
        blinkCtx.fillRect(0, 0, cw, ch);
      }
    }

    // =========================================================================
    // 3. STAGE 1 — HIMALAYAN BALCONY VIEW (from view.html)
    // =========================================================================
    const treeLeftCanvas = document.createElement('canvas');
    const treeRightCanvas = document.createElement('canvas');
    const treeSmallCanvas = document.createElement('canvas');
    const archCanvas = document.createElement('canvas');
    const blurFgCanvas = document.createElement('canvas');

    let targetMouseX = 0, targetMouseY = 0, mouseX = 0, mouseY = 0;
    let gl = null, glProgram = null, glBuffer = null;
    let uResolution = null, uTime = null, uParallax = null;
    let balconyActive = true;

    const BALCONY_VERT_SRC = `
      attribute vec2 a_pos;
      void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
    `;

    const BALCONY_FRAG_SRC = `
      precision highp float;
      uniform vec2 u_resolution;
      uniform float u_time;
      uniform vec2 u_parallax;

      float hash(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),

        ctx.moveTo(xNear - sign * stileNearW * 0.5, botNearY);
        ctx.lineTo(xFar + sign * stileFarW, botFarY + height * 0.07);
        ctx.lineTo(xFar + sign * stileFarW * 2.2, botFarY + height * 0.085);
        ctx.lineTo(xNear + sign * stileNearW * 1.4, botNearY + height * 0.015);
        ctx.closePath(); ctx.fill();

        ctx.beginPath();
        ctx.moveTo(xNear + sign * stileNearW * 0.4, 0); ctx.lineTo(xFar - sign * stileFarW * 0.4, 0);
        ctx.lineTo(xFar - sign * stileFarW * 0.4, botFarY); ctx.lineTo(xNear + sign * stileNearW * 0.4, botNearY - height * 0.045);
        ctx.closePath();
        const paneGrad = ctx.createLinearGradient(xNear, 0, xFar, height * 0.8);
        paneGrad.addColorStop(0, 'rgba(220, 236, 252, 0.14)'); paneGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.06)');
        paneGrad.addColorStop(0.75, 'rgba(180, 210, 232, 0.12)'); paneGrad.addColorStop(1, 'rgba(230, 215, 198, 0.16)');
        ctx.fillStyle = paneGrad; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(xNear + sign * stileNearW * 0.35, botNearY);
        ctx.lineTo(xFar + sign * stileFarW * 0.2, botFarY + height * 0.032);
        ctx.lineTo(xFar + sign * stileFarW * 0.2, botFarY - height * 0.028);
        ctx.lineTo(xNear + sign * stileNearW * 0.35, botNearY - height * 0.062);
        ctx.closePath();
        const woodRailGrad = ctx.createLinearGradient(xNear, botNearY, xFar, botFarY);
        woodRailGrad.addColorStop(0, '#8d5d3e'); woodRailGrad.addColorStop(0.5, '#b67d56'); woodRailGrad.addColorStop(1, '#7a4d32');
        ctx.fillStyle = woodRailGrad; ctx.fill();

        const farGrad = ctx.createLinearGradient(xFar - stileFarW, 0, xFar + stileFarW, 0);
        farGrad.addColorStop(0, isLeft ? '#6d442b' : '#1b1614'); farGrad.addColorStop(0.45, '#2b201b'); farGrad.addColorStop(1, isLeft ? '#181412' : '#6d442b');
        ctx.fillStyle = farGrad;
        ctx.fillRect(xFar - stileFarW * 0.5, 0, stileFarW, botFarY + height * 0.034);

        const nearGrad = ctx.createLinearGradient(xNear - stileNearW * 0.5, 0, xNear + stileNearW * 0.5, 0);
        nearGrad.addColorStop(0, '#141110'); nearGrad.addColorStop(0.35, '#251e1b'); nearGrad.addColorStop(0.78, '#171311'); nearGrad.addColorStop(1, '#4a3123');
        ctx.fillStyle = nearGrad;
        ctx.fillRect(xNear - stileNearW * 0.5, 0, stileNearW, botNearY + 2);

        const handleY = height * 0.335, handleH = height * 0.105, handleW = width * 0.014;
        const hx = isLeft ? xNear + stileNearW * 0.42 : xNear - stileNearW * 0.42 - handleW;
        ctx.strokeStyle = '#141517'; ctx.lineWidth = Math.max(2.5, width * 0.0032);
        ctx.strokeRect(hx, handleY, handleW, handleH);
        ctx.restore();
      }
      drawOpenFrenchDoor(true);
      drawOpenFrenchDoor(false);
    }

    function buildBlurredForegroundCanvas(width, height) {
      blurFgCanvas.width = width;
      blurFgCanvas.height = height;
      const ctx = blurFgCanvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.filter = `blur(${Math.max(3.5, Math.min(8, width * 0.0055))}px)`;

      const tblTopY = height * 0.878, tblBotY = height * 0.962;
      ctx.beginPath();
      ctx.moveTo(width * 0.085, tblTopY); ctx.lineTo(width * 0.755, tblTopY);
      ctx.lineTo(width * 0.795, tblBotY); ctx.lineTo(width * 0.030, tblBotY);
      ctx.closePath();
      const tblGrad = ctx.createLinearGradient(0, tblTopY, 0, tblBotY);
      tblGrad.addColorStop(0, '#5a595c'); tblGrad.addColorStop(0.35, '#727175'); tblGrad.addColorStop(0.72, '#535256'); tblGrad.addColorStop(1, '#39383b');
      ctx.fillStyle = tblGrad; ctx.fill();

      const spX = width * 0.324, spY = height * 0.868, spW = width * 0.092, spH = height * 0.072;
      ctx.fillStyle = '#242326';
      ctx.fillRect(spX, spY + spH * 0.14, spW, spH * 0.86);

      const pcX = width * 0.464, pcY = height * 0.908;
      ctx.fillStyle = '#1f1b1a';
      ctx.beginPath(); ctx.ellipse(pcX, pcY, width * 0.028, height * 0.036, 0.18, 0, Math.PI * 2); ctx.fill();

      const sofaGrad = ctx.createLinearGradient(0, height * 0.935, 0, height);
      sofaGrad.addColorStop(0, '#363332'); sofaGrad.addColorStop(0.45, '#252222'); sofaGrad.addColorStop(1, '#181616');
      ctx.fillStyle = sofaGrad;
      ctx.beginPath();
      ctx.moveTo(-20, height); ctx.lineTo(-20, height * 0.942);
      ctx.quadraticCurveTo(width * 0.16, height * 0.922, width * 0.30, height * 0.936);
      ctx.lineTo(width * 0.30, height * 0.954); ctx.lineTo(width * 0.45, height * 0.954);
      ctx.quadraticCurveTo(width * 0.68, height * 0.945, width * 0.88, height * 0.930);
      ctx.lineTo(width + 20, height * 0.968); ctx.lineTo(width + 20, height + 20);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    const mistPuffs = [];

    function renderBalconyFrame(dt, elapsed) {
      if (!balconyActive) return;
      const breathX = Math.sin(elapsed * 0.42) * 0.08;
      const breathY = Math.sin(elapsed * 0.78) * 0.10;
      mouseX += (targetMouseX + breathX - mouseX) * Math.min(1, dt * 3.5);
      mouseY += (targetMouseY + breathY - mouseY) * Math.min(1, dt * 3.5);

      if (gl && glProgram) {
        gl.useProgram(glProgram);
        gl.uniform2f(uResolution, glCanvas.width, glCanvas.height);
        gl.uniform1f(uTime, elapsed);
        gl.uniform2f(uParallax, mouseX, mouseY);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
      }

      const cw = fgCanvas.width, ch = fgCanvas.height;
      fgCtx.clearRect(0, 0, cw, ch);
      const swayL = Math.sin(elapsed * 0.85) * 0.007 + Math.sin(elapsed * 1.9) * 0.003;
      const swayR = Math.sin(elapsed * 0.72 + 1.4) * 0.006 + Math.sin(elapsed * 1.65) * 0.0025;
      const treePx = mouseX * cw * 0.011, treePy = mouseY * ch * 0.008;

      fgCtx.drawImage(treeSmallCanvas, cw * 0.102 + treePx * 0.85, ch * 0.625 + treePy * 0.85);
      fgCtx.save();
      fgCtx.translate(cw * 0.305 + treePx, ch * 0.785 + treePy);
      fgCtx.rotate(swayL);
      fgCtx.drawImage(treeLeftCanvas, -treeLeftCanvas.width * 0.5, -treeLeftCanvas.height * 0.94);
      fgCtx.restore();

      fgCtx.save();
      fgCtx.translate(cw * 0.725 + treePx, ch * 0.790 + treePy);
      fgCtx.rotate(swayR);
      fgCtx.drawImage(treeRightCanvas, -treeRightCanvas.width * 0.5, -treeRightCanvas.height * 0.94);
      fgCtx.restore();

      fgCtx.save();
      for (let i = 0; i < mistPuffs.length; i++) {
        const m = mistPuffs[i];
        m.x += m.speed * dt;
        if (m.x > 1.35) m.x = -0.35;
        const mx = m.x * cw + treePx * 1.1, my = m.y * ch + treePy * 1.1;
        const mrx = m.rx * cw, mry = m.ry * ch;
        const grad = fgCtx.createRadialGradient(mx, my, 0, mx, my, mrx);
        grad.addColorStop(0, `rgba(232, 238, 244, ${m.alpha})`);
        grad.addColorStop(0.55, `rgba(218, 228, 236, ${m.alpha * 0.45})`);
        grad.addColorStop(1, 'rgba(218, 228, 236, 0)');
        fgCtx.save();
        fgCtx.translate(mx, my);
        fgCtx.scale(1, mry / mrx);
        fgCtx.fillStyle = grad;
        fgCtx.beginPath(); fgCtx.arc(0, 0, mrx, 0, Math.PI * 2); fgCtx.fill();
        fgCtx.restore();
      }
      fgCtx.restore();

      fgCtx.drawImage(archCanvas, mouseX * cw * 0.005, mouseY * ch * 0.004);
      fgCtx.drawImage(blurFgCanvas, mouseX * cw * 0.014, mouseY * ch * 0.010);
    }

    // =========================================================================
    // 4. PURE BEACH SCENE + TWILIGHT SKY (SUN + MOON VISIBLE TOGETHER)
    // =========================================================================
    const CORRIDOR_CENTER_Z = 3.5;

    function getBeachHeight(x, z) {
      let h = 0.0;
      if (z < -13.5) {
        const t = (-13.5 - z) / 24.0;
        h -= Math.pow(t, 1.32) * 3.8;
      } else {
        const t = (z + 13.5) / 58.0;
        h += Math.pow(t, 1.45) * 1.85;
      }
      const distFromWalkway = Math.hypot(x, z - CORRIDOR_CENTER_Z);
      const walkwayFlatMask = THREE.MathUtils.smoothstep(distFromWalkway, 5.0, 22.0);
      h += (fbm2D(x * 0.042 + 10.2, z * 0.042 + 5.7, 4) - 0.5) * (0.28 + 0.95 * walkwayFlatMask);
      const ripple = Math.sin(z * 0.72 + x * 0.16 + fbm2D(x * 0.12, z * 0.12, 2) * 2.5) * 0.032;
      h += ripple * THREE.MathUtils.smoothstep(z, -20.0, -8.0);
      return h;
    }

    function createSandTextures() {
      const size = 512;
      const colorCanvas = document.createElement('canvas');
      const bumpCanvas = document.createElement('canvas');
      colorCanvas.width = bumpCanvas.width = size;
      colorCanvas.height = bumpCanvas.height = size;
      const cCtx = colorCanvas.getContext('2d');
      const bCtx = bumpCanvas.getContext('2d');
      const cImg = cCtx.createImageData(size, size);
      const bImg = bCtx.createImageData(size, size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const idx = (y * size + x) * 4;
          const nx = x / size, ny = y / size;
          const warp = fbm2D(nx * 6.0, ny * 6.0, 3) * 1.4;
          const ripple = Math.sin((ny * 22.0 + nx * 4.0 + warp) * Math.PI * 2.0) * 0.5 + 0.5;
          const grain = hash2D(x * 1.37, y * 1.91);
          const microGrain = hash2D(x * 3.13 + 17, y * 2.71 + 43);
          const sparkle = grain > 0.985 ? 26 : 0;
          const shade = 0.88 + ripple * 0.08 + (grain - 0.5) * 0.12 + (microGrain - 0.5) * 0.06;
          cImg.data[idx]     = Math.min(255, Math.max(0, 232 * shade + sparkle));
          cImg.data[idx + 1] = Math.min(255, Math.max(0, 212 * shade + sparkle));
          cImg.data[idx + 2] = Math.min(255, Math.max(0, 178 * shade + sparkle * 0.8));
          cImg.data[idx + 3] = 255;
          const bumpVal = Math.min(255, Math.max(0, (ripple * 0.62 + grain * 0.38) * 255));
          bImg.data[idx] = bImg.data[idx + 1] = bImg.data[idx + 2] = bumpVal;
          bImg.data[idx + 3] = 255;
        }
      }
      cCtx.putImageData(cImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(colorCanvas);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(28, 28);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 8;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(28, 28);
      bumpMap.anisotropy = 8;
      return { map, bumpMap };
    }

    function createAtmosphericSky() {
      const skyGeo = new THREE.SphereGeometry(280, 48, 32);
      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          uSunDir: { value: new THREE.Vector3(0.42, 0.26, -0.87).normalize() },
          uMoonDir: { value: new THREE.Vector3(-0.34, 0.22, -0.91).normalize() },
          uZenithColor: { value: new THREE.Color('#2c639c') },
          uHorizonColor: { value: new THREE.Color('#f4d2a8') },
          uSunColor: { value: new THREE.Color('#fff3d1') },
          uGroundColor: { value: new THREE.Color('#d8b992') },
          uTime: { value: 0 },
          uTwilightFactor: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vWorldDir;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldDir = normalize(worldPos.xyz);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `,
        fragmentShader: `
          uniform vec3 uSunDir;
          uniform vec3 uMoonDir;
          uniform vec3 uZenithColor;
          uniform vec3 uHorizonColor;
          uniform vec3 uSunColor;
          uniform vec3 uGroundColor;
          uniform float uTime;
          uniform float uTwilightFactor;
          varying vec3 vWorldDir;

          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
          }
          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                       mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
          }
          float fbm(vec2 p) {
            float v = 0.0, a = 0.5;
            for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.05; a *= 0.5; }
            return v;
          }

          void main() {
            vec3 dir = normalize(vWorldDir);
            float y = dir.y;

            float horizonBlend = pow(1.0 - clamp(y, 0.0, 1.0), 2.35);
            vec3 sky = mix(uZenithColor, uHorizonColor, horizonBlend);
            if (y < 0.0) sky = mix(uHorizonColor, uGroundColor, clamp(-y * 4.5, 0.0, 1.0));

            // Warm rose-violet twilight band above sunset horizon
            float twiBand = exp(-pow((y - 0.14) / 0.16, 2.0)) * uTwilightFactor;
            sky += vec3(0.42, 0.14, 0.30) * twiBand;

            // Solar glow + setting Sun disk
            float sunDot = max(dot(dir, normalize(uSunDir)), 0.0);
            float sunGlow = pow(sunDot, 9.0) * (0.45 + uTwilightFactor * 0.25) + pow(sunDot, 75.0) * 0.65;
            float sunDisk = smoothstep(0.9987, 0.9995, sunDot);
            sky += uSunColor * sunGlow + uSunColor * sunDisk * 2.2;

            // Luminous Full Moon visible simultaneously in the twilight sky
            vec3 mDir = normalize(uMoonDir);
            float moonDot = max(dot(dir, mDir), 0.0);
            float moonVis = 0.18 + 0.82 * smoothstep(0.0, 0.75, uTwilightFactor);
            float moonHalo = (pow(moonDot, 16.0) * 0.22 + pow(moonDot, 110.0) * 0.48) * smoothstep(0.05, 0.8, uTwilightFactor);
            float moonDisk = smoothstep(0.9985, 0.9991, moonDot);
            vec3 moonRight = normalize(cross(vec3(0.0, 1.0, 0.0), mDir));
            vec3 moonUp = cross(mDir, moonRight);
            vec2 moonUV = vec2(dot(dir, moonRight), dot(dir, moonUp)) * 22.0;
            float craters = fbm(moonUV * 1.6 + vec2(3.1, 1.7));
            vec3 moonSurface = mix(vec3(0.80, 0.86, 0.96), vec3(1.0, 0.99, 0.96), smoothstep(0.30, 0.74, craters));
            sky += vec3(0.75, 0.86, 1.0) * moonHalo;
            sky = mix(sky, moonSurface * (1.25 + 0.45 * uTwilightFactor), moonDisk * moonVis);

            // Subtle upper-sky twilight stars fading in near zenith
            if (uTwilightFactor > 0.15 && y > 0.14) {
              vec2 starUV = dir.xz / (y + 0.35) * 95.0;
              vec2 cell = floor(starUV);
              vec2 local = fract(starUV) - 0.5;
              float rnd = hash(cell);
              if (rnd > 0.978) {
                float d = length(local);
                float twinkle = 0.65 + 0.35 * sin(uTime * (2.0 + rnd * 4.0) + rnd * 62.8);
                sky += vec3(0.90, 0.94, 1.0) * smoothstep(0.24, 0.02, d) * twinkle * smoothstep(0.14, 0.48, y) * uTwilightFactor * 0.85;
              }
            }

            if (y > 0.03) {
              vec2 cloudUV = dir.xz / (y + 0.16) * 0.75 + vec2(uTime * 0.006, -uTime * 0.003);
              float c = fbm(cloudUV);
              float cloudMask = smoothstep(0.54, 0.84, c) * smoothstep(0.03, 0.24, y) * (1.0 - smoothstep(0.6, 0.95, y));
              vec3 dayCloud = mix(vec3(0.98, 0.96, 0.94), uHorizonColor * 1.12, 0.45 + 0.35 * sunDot);
              vec3 twiCloud = mix(vec3(0.26, 0.22, 0.42), vec3(1.0, 0.62, 0.42), 0.35 + 0.65 * pow(sunDot, 2.0));
              sky = mix(sky, mix(dayCloud, twiCloud, uTwilightFactor), cloudMask * 0.52);
            }
            gl_FragColor = vec4(sky, 1.0);
          }
        `
      });
      return new THREE.Mesh(skyGeo, skyMat);
    }

    function createAnimatedOcean() {
      const oceanGeo = new THREE.PlaneGeometry(360, 240, 140, 140);
      oceanGeo.rotateX(-Math.PI / 2);

      const oceanMat = new THREE.ShaderMaterial({
        transparent: true,
        uniforms: {
          uTime: { value: 0 },
          uSunDir: { value: new THREE.Vector3(0.42, 0.26, -0.87).normalize() },
          uMoonDir: { value: new THREE.Vector3(-0.34, 0.22, -0.91).normalize() },
          uSunColor: { value: new THREE.Color('#fff2cc') },
          uSkyHorizon: { value: new THREE.Color('#f4d2a8') },
          uSkyZenith: { value: new THREE.Color('#2c639c') },
          uDeepColor: { value: new THREE.Color('#0c445c') },
          uShallowColor: { value: new THREE.Color('#2d8c8e') },
          uFogColor: { value: new THREE.Color('#e8d4bc') },
          uFogDensity: { value: 0.0046 },
          uTwilightFactor: { value: 0.0 }
        },
        vertexShader: `
          uniform float uTime;
          varying vec3 vWorldPos;
          varying vec3 vNormal;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            float shoreFactor = clamp((-wp.z - 12.0) / 14.0, 0.08, 1.0);
            float w1 = sin(wp.z * 0.38 + uTime * 1.35 + wp.x * 0.06) * 0.14;
            float w2 = sin(wp.x * 0.22 - wp.z * 0.28 + uTime * 0.95) * 0.07;
            float w3 = cos(wp.z * 0.85 - wp.x * 0.42 + uTime * 2.1) * 0.035;
            wp.y += (w1 + w2 + w3) * shoreFactor;
            float dHdx = (cos(wp.z * 0.38 + uTime * 1.35 + wp.x * 0.06) * 0.06 * 0.14
                        + cos(wp.x * 0.22 - wp.z * 0.28 + uTime * 0.95) * 0.22 * 0.07
                        + sin(wp.z * 0.85 - wp.x * 0.42 + uTime * 2.1) * 0.42 * 0.035) * shoreFactor;
            float dHdz = (cos(wp.z * 0.38 + uTime * 1.35 + wp.x * 0.06) * 0.38 * 0.14
                        - cos(wp.x * 0.22 - wp.z * 0.28 + uTime * 0.95) * 0.28 * 0.07
                        - sin(wp.z * 0.85 - wp.x * 0.42 + uTime * 2.1) * 0.85 * 0.035) * shoreFactor;
            vNormal = normalize(vec3(-dHdx, 1.0, -dHdz));
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3 uSunDir;
          uniform vec3 uMoonDir;
          uniform vec3 uSunColor;
          uniform vec3 uSkyHorizon;
          uniform vec3 uSkyZenith;
          uniform vec3 uDeepColor;
          uniform vec3 uShallowColor;
          uniform vec3 uFogColor;
          uniform float uFogDensity;
          uniform float uTwilightFactor;
          varying vec3 vWorldPos;
          varying vec3 vNormal;

          float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
          float noise(vec2 p) {
            vec2 i = floor(p), f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                       mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
          }

          void main() {
            vec3 viewDir = normalize(cameraPosition - vWorldPos);
            vec2 uv1 = vWorldPos.xz * 0.42 + vec2(uTime * 0.28, uTime * 0.45);
            vec2 uv2 = vWorldPos.xz * 0.85 + vec2(-uTime * 0.35, uTime * 0.22);
            float r1 = noise(uv1) - 0.5, r2 = noise(uv2) - 0.5;
            vec3 N = normalize(vNormal + vec3((r1 + r2) * 0.16, 0.0, (r1 - r2) * 0.18));

            float fresnel = clamp(0.06 + pow(1.0 - max(dot(viewDir, N), 0.0), 4.0) * 0.88, 0.0, 1.0);
            float depthT = clamp((-vWorldPos.z - 13.0) / 42.0, 0.0, 1.0);
            vec3 waterBody = mix(uShallowColor, uDeepColor, pow(depthT, 0.72));
            vec3 reflDir = reflect(-viewDir, N);
            vec3 skyRefl = mix(uSkyHorizon, uSkyZenith, clamp(reflDir.y * 1.4, 0.0, 1.0));

            vec3 halfVec = normalize(normalize(uSunDir) + viewDir);
            float specTight = pow(max(dot(N, halfVec), 0.0), 220.0) * 2.5;

            trimPts.push(new THREE.Vector3(side * THREE.MathUtils.lerp(0.088, 0.056, t), p.y - 0.015, p.z + 0.01));
          }
          legGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(trimPts), 24, 0.010, 8, false), mats.antiqueGold));
        });

      }

      for (let i = 0; i < 4; i++) {
        const leg = buildCabrioleLeg();
        leg.rotation.y = (i * Math.PI) / 2 + Math.PI / 4;

      });
      const doilyMesh = new THREE.Mesh(new THREE.CircleGeometry(0.62, 64), doilyMat);
      doilyMesh.rotation.x = -Math.PI / 2; doilyMesh.position.y = topY + 0.0025; doilyMesh.receiveShadow = true;
      group.add(doilyMesh);

      // Peripheral Votive Candles & Antique Gold Accent Dishes (center kept completely clear!)
      const votiveFlames = [];
      const votivePointLights = [];
      const flameGlowTex = createVotiveFlameGlowTexture();
      const flameOuterGeo = new THREE.ConeGeometry(0.014, 0.052, 10); flameOuterGeo.translate(0, 0.024, 0);
      const flameInnerGeo = new THREE.ConeGeometry(0.007, 0.028, 8); flameInnerGeo.translate(0, 0.014, 0);
      const flameOuterMat = new THREE.MeshBasicMaterial({ color: 0xffa638, transparent: true, opacity: 0.92 });
      const flameInnerMat = new THREE.MeshBasicMaterial({ color: 0xfff8dc });

      function addVotive(type, x, z) {

          wax.position.y = 0.144; hg.add(wax);

        } else if (type === 'tallRibbed') {
          const prof = [
            new THREE.Vector2(0,0), new THREE.Vector2(0.058,0), new THREE.Vector2(0.066,0.175),
            new THREE.Vector2(0.060,0.175), new THREE.Vector2(0.052,0.014), new THREE.Vector2(0,0.014)
          ];
          hg.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 28), mats.ribbedGlass));
          const wax = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.046, 0.115, 18), mats.wax);
          wax.position.y = 0.0725; hg.add(wax);
          flameY = 0.138;
        } else {
          const prof = [
            new THREE.Vector2(0,0), new THREE.Vector2(0.046,0), new THREE.Vector2(0.066,0.055), new THREE.Vector2(0.056,0.105),
            new THREE.Vector2(0.050,0.105), new THREE.Vector2(0.058,0.055), new THREE.Vector2(0.042,0.012), new THREE.Vector2(0,0.012)
          ];
          hg.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 24), type === 'lowAmber' ? mats.amberGlass : mats.ribbedGlass));
          const wax = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.038, 0.062, 16), mats.wax);
          wax.position.y = 0.044; hg.add(wax);
          flameY = 0.083;
        }
        const fg = new THREE.Group(); fg.position.y = flameY;
        fg.add(new THREE.Mesh(flameOuterGeo, flameOuterMat.clone()), new THREE.Mesh(flameInnerGeo, flameInnerMat));
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameGlowTex, color: 0xffb85c, transparent: true, opacity: 0.72, blending: THREE.AdditiveBlending, depthWrite: false }));
        glow.scale.set(0.18, 0.22, 1); glow.position.y = 0.025; fg.add(glow);
        hg.add(fg);
        votiveFlames.push({ group: fg, sprite: glow, phase: Math.random() * Math.PI * 2, speed: 5.5 + Math.random() * 4.5 });
        group.add(hg);
      }

      [
        { type: 'footed', x: -0.76, z: -0.22 }, { type: 'tallRibbed', x: -0.94, z: 0.04 },
        { type: 'lowClear', x: -0.78, z: 0.30 }, { type: 'lowAmber', x: -1.04, z: 0.18 },
        { type: 'footed', x: 0.76, z: -0.22 }, { type: 'tallRibbed', x: 0.94, z: 0.04 },
        { type: 'lowClear', x: 0.78, z: 0.30 }, { type: 'lowAmber', x: 0.64, z: 0.56 },
        { type: 'tallRibbed', x: -0.44, z: -0.78 }, { type: 'lowAmber', x: 0.44, z: -0.78 }
      ].forEach((c) => addVotive(c.type, c.x, c.z));

      [[-0.82, topY + 0.30, 0.08], [0.82, topY + 0.30, 0.08], [0, topY + 0.28, -0.75]].forEach((pos, idx) => {
        const pt = new THREE.PointLight(0xffa447, 0.0, 3.8, 1.8);
        pt.position.set(pos[0], pos[1], pos[2]);
        group.add(pt);
        votivePointLights.push({ light: pt, phase: idx * 1.7 + 0.5 });
      });

      function addGoldDish(x, z, hasLid) {
        const dg = new THREE.Group(); dg.position.set(x, topY + 0.002, z);
        const dishProf = [
          new THREE.Vector2(0,0), new THREE.Vector2(0.065,0), new THREE.Vector2(0.105,0.022),
          new THREE.Vector2(0.112,0.028), new THREE.Vector2(0.098,0.028), new THREE.Vector2(0.062,0.008), new THREE.Vector2(0,0.008)
        ];
        const dish = new THREE.Mesh(new THREE.LatheGeometry(dishProf, 28), mats.urnGold);
        dish.castShadow = true; dish.receiveShadow = true; dg.add(dish);
        if (hasLid) {
          const lid = new THREE.Mesh(new THREE.SphereGeometry(0.062, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.45), mats.antiqueGold);
          lid.scale.set(1, 0.55, 1); lid.position.y = 0.012; dg.add(lid);
          const knob = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 10), mats.antiqueGold);

      addGoldDish(-0.56, 0.52, false);
      addGoldDish(1.06, 0.16, true);
      addGoldDish(-0.26, 0.90, false);

      scene.add(group);

      function update(t, glowStrength) {
        for (const f of votiveFlames) {
          const fl = Math.sin(t * f.speed + f.phase) * 0.10 + Math.sin(t * f.speed * 2.1 + f.phase) * 0.06;
          f.group.scale.set(1.0 - fl * 0.35, 1.0 + fl, 1.0 - fl * 0.35);
          f.group.rotation.z = Math.sin(t * 3.1 + f.phase) * 0.07;
          f.sprite.material.opacity = 0.62 + fl * 0.8;
        }
        for (const pl of votivePointLights) {
          const pulse = 1.0 + Math.sin(t * 7.0 + pl.phase) * 0.12;
          pl.light.intensity = (0.35 + glowStrength * 1.15) * pulse;
        }
      }

      return { group, topY, topRadius, update };
    }

    // =========================================================================
    // 6. CASCADING SAND SYSTEM FOR TABLE EMERGENCE (from beach.html)
    // =========================================================================
    function createTableSandSystem(scene) {
      const count = 900;
      const positions = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);
      const life = new Float32Array(count);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i * 3 + 1] = -999;
        const shade = 0.82 + Math.random() * 0.25;
        colors[i * 3] = 0.90 * shade; colors[i * 3 + 1] = 0.77 * shade; colors[i * 3 + 2] = 0.58 * shade;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const sc = document.createElement('canvas'); sc.width = sc.height = 32;
      const sctx = sc.getContext('2d');
      const g = sctx.createRadialGradient(16, 16, 1, 16, 16, 15);
      g.addColorStop(0, 'rgba(255, 244, 220, 0.95)'); g.addColorStop(0.55, 'rgba(225, 198, 156, 0.65)'); g.addColorStop(1, 'rgba(205, 175, 132, 0.0)');
      sctx.fillStyle = g; sctx.fillRect(0, 0, 32, 32);
      const tex = new THREE.CanvasTexture(sc); tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.PointsMaterial({ map: tex, size: 0.12, vertexColors: true, transparent: true, opacity: 0.88, depthWrite: false });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);

      let cursor = 0;
      function emit(tableWorldPos, tableTopWorldY, radius, emitCount) {
        for (let k = 0; k < emitCount; k++) {
          const idx = cursor; cursor = (cursor + 1) % count;
          const a = Math.random() * Math.PI * 2;
          const rim = Math.random() < 0.68;
          const r = rim ? radius * (0.86 + Math.random() * 0.16) : radius * (0.25 + Math.random() * 0.48);
          const py = rim ? tableTopWorldY - Math.random() * 0.06 : tableTopWorldY - 0.35 - Math.random() * 0.55;
          if (py < tableWorldPos.y - 0.05) continue;
          positions[idx * 3] = tableWorldPos.x + Math.cos(a) * r;
          positions[idx * 3 + 1] = py;
          positions[idx * 3 + 2] = tableWorldPos.z + Math.sin(a) * r;
          velocities[idx * 3] = Math.cos(a) * (0.25 + Math.random() * 0.45);
          velocities[idx * 3 + 1] = 0.05 + Math.random() * 0.25;
          velocities[idx * 3 + 2] = Math.sin(a) * (0.25 + Math.random() * 0.45);
          life[idx] = 1.3 + Math.random() * 1.1;
        }
      }

      function update(dt, twilightFactor) {
        let dirty = false;
        const dim = 1.0 - twilightFactor * 0.45;
        mat.color.setRGB(dim, dim * 0.96, dim * 0.92);
        for (let i = 0; i < count; i++) {
          if (life[i] <= 0) continue;
          dirty = true;
          life[i] -= dt;
          if (life[i] <= 0) { positions[i * 3 + 1] = -999; continue; }
          velocities[i * 3] *= (1 - dt * 1.2);
          velocities[i * 3 + 2] *= (1 - dt * 1.2);
          velocities[i * 3 + 1] -= 3.8 * dt;
          positions[i * 3] += velocities[i * 3] * dt;
          positions[i * 3 + 1] += velocities[i * 3 + 1] * dt;
          positions[i * 3 + 2] += velocities[i * 3 + 2] * dt;
          const gy = getBeachHeight(positions[i * 3], positions[i * 3 + 2]) + 0.025;
          if (positions[i * 3 + 1] <= gy) {
            positions[i * 3 + 1] = gy;
            velocities[i * 3] *= 0.6; velocities[i * 3 + 1] = 0; velocities[i * 3 + 2] *= 0.6;
            life[i] -= dt * 2.8;
          }
        }
        if (dirty) geo.attributes.position.needsUpdate = true;
      }

      function clear() {
        for (let i = 0; i < count; i++) { life[i] = 0; positions[i * 3 + 1] = -999; }
        geo.attributes.position.needsUpdate = true;
      }
      return { emit, update, clear };
    }

    // =========================================================================
    // 6B. POOLED GOLDEN STARDUST TRAIL + 3D SKY FIREWORKS / CRACKERS SHOW
    // =========================================================================
    function createStardustTrailSystem(scene) {
      const count = 180;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const vel = new Float32Array(count * 3);
      const life = new Float32Array(count);
      const maxLife = new Float32Array(count);

      for (let i = 0; i < count; i++) positions[i * 3 + 1] = -999;

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const sc = document.createElement('canvas'); sc.width = sc.height = 32;
      const sctx = sc.getContext('2d');
      const sg = sctx.createRadialGradient(16, 16, 1, 16, 16, 16);
      sg.addColorStop(0, 'rgba(255, 250, 224, 1.0)');
      sg.addColorStop(0.35, 'rgba(255, 212, 118, 0.72)');
      sg.addColorStop(1, 'rgba(255, 170, 70, 0.0)');
      sctx.fillStyle = sg; sctx.fillRect(0, 0, 32, 32);
      const tex = new THREE.CanvasTexture(sc); tex.colorSpace = THREE.SRGBColorSpace;

      const mat = new THREE.PointsMaterial({
        map: tex, size: 0.24, vertexColors: true, transparent: true,
        opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);

      let cursor = 0;
      function emit(worldPos, spread = 0.42, emitCount = 4, boostScale = 1.0) {
        for (let k = 0; k < emitCount; k++) {
          const i = cursor; cursor = (cursor + 1) % count;
          positions[i * 3] = worldPos.x + (Math.random() - 0.5) * spread;
          positions[i * 3 + 1] = worldPos.y + (Math.random() - 0.5) * spread * 0.7;
          positions[i * 3 + 2] = worldPos.z + (Math.random() - 0.5) * spread;
          vel[i * 3] = (Math.random() - 0.5) * 0.45 * boostScale;
          vel[i * 3 + 1] = (-0.15 - Math.random() * 0.45) * boostScale;
          vel[i * 3 + 2] = (Math.random() - 0.5) * 0.45 * boostScale;
          maxLife[i] = life[i] = 0.85 + Math.random() * 0.85;
          const warm = Math.random();
          colors[i * 3] = 1.0;
          colors[i * 3 + 1] = 0.78 + warm * 0.20;
          colors[i * 3 + 2] = 0.34 + warm * 0.48;
        }
      }

      function update(dt) {
        let dirty = false;
        for (let i = 0; i < count; i++) {
          if (life[i] <= 0) continue;
          dirty = true;
          life[i] -= dt;
          if (life[i] <= 0) { positions[i * 3 + 1] = -999; continue; }
          const k = life[i] / maxLife[i];
          vel[i * 3] *= (1 - dt * 1.4);
          vel[i * 3 + 2] *= (1 - dt * 1.4);
          positions[i * 3] += vel[i * 3] * dt;
          positions[i * 3 + 1] += vel[i * 3 + 1] * dt;
          positions[i * 3 + 2] += vel[i * 3 + 2] * dt;
          const fade = Math.pow(k, 0.75);
          colors[i * 3] = fade;
          colors[i * 3 + 1] = 0.84 * fade;
          colors[i * 3 + 2] = 0.42 * fade;
        }
        if (dirty) {
          geo.attributes.position.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
        }
      }

      function clear() {
        for (let i = 0; i < count; i++) { life[i] = 0; positions[i * 3 + 1] = -999; }
        geo.attributes.position.needsUpdate = true;
      }

      return { emit, update, clear };
    }

    function createFireworksSystem(scene) {
      const MAX_STARS = 1800;
      const MAX_ROCKETS = 8;

      const positions = new Float32Array(MAX_STARS * 3);
      const colors = new Float32Array(MAX_STARS * 3);
      const sizes = new Float32Array(MAX_STARS);
      const vel = new Float32Array(MAX_STARS * 3);
      const life = new Float32Array(MAX_STARS);
      const maxLife = new Float32Array(MAX_STARS);
      const drag = new Float32Array(MAX_STARS);
      const twinklePhase = new Float32Array(MAX_STARS);

      for (let i = 0; i < MAX_STARS; i++) {
        positions[i * 3 + 1] = -999;
        sizes[i] = 0.0;
      }

      const geo = new THREE.BufferGeometry();
      const posAttr = new THREE.BufferAttribute(positions, 3);
      const colAttr = new THREE.BufferAttribute(colors, 3);
      const sizeAttr = new THREE.BufferAttribute(sizes, 1);
      geo.setAttribute('position', posAttr);
      geo.setAttribute('aColor', colAttr);
      geo.setAttribute('aSize', sizeAttr);

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
        },
        vertexShader: `
          attribute vec3 aColor;
          attribute float aSize;
          varying vec3 vColor;
          uniform float uPixelRatio;
          void main() {
            vColor = aColor;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            gl_PointSize = aSize * uPixelRatio * (380.0 / max(2.0, -mvPosition.z));
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            vec2 c = gl_PointCoord - vec2(0.5);
            float d = length(c) * 2.0;
            if (d > 1.0) discard;
            float core = pow(1.0 - d, 1.65);
            float hot = exp(-d * d * 7.5);
            gl_FragColor = vec4(vColor * (core + hot * 0.9), core);
          }
        `
      });

      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      scene.add(points);

      const flashLight = new THREE.PointLight(0xffcf88, 0.0, 95, 1.25);
      flashLight.position.set(0, 14, -26);
      scene.add(flashLight);

      const palettes = [
        [new THREE.Color('#ffd374'), new THREE.Color('#fff5d6')],
        [new THREE.Color('#ff6ea8'), new THREE.Color('#ffd88a')],
        [new THREE.Color('#5ef0ff'), new THREE.Color('#ffd670')],
        [new THREE.Color('#ff9d47'), new THREE.Color('#fff6e8')],
        [new THREE.Color('#c79eff'), new THREE.Color('#ff8cd2')]
      ];

      const rockets = [];
      for (let i = 0; i < MAX_ROCKETS; i++) {
        rockets.push({ active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, peakY: 14, paletteIdx: 0, trailTimer: 0 });
      }

      let starCursor = 0;
      let active = false;
      let launchTimer = 0.05;
      let flashIntensity = 0;

      function spawnStar(x, y, z, vx, vy, vz, r, g, b, lifeSec, sizeVal, dragCoeff) {
        const i = starCursor;
        starCursor = (starCursor + 1) % MAX_STARS;
        positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
        vel[i * 3] = vx; vel[i * 3 + 1] = vy; vel[i * 3 + 2] = vz;
        colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
        life[i] = lifeSec; maxLife[i] = lifeSec;
        sizes[i] = sizeVal;
        drag[i] = dragCoeff;
        twinklePhase[i] = Math.random() * 6.283;
      }

      function launchRocket() {
        const slot = rockets.find((r) => !r.active);
        if (!slot) return;
        slot.active = true;
        slot.x = (Math.random() - 0.5) * 32.0;
        slot.z = -18.0 - Math.random() * 20.0;
        slot.y = -0.3;
        slot.peakY = 9.0 + Math.random() * 11.0;
        const flightTime = 0.85 + Math.random() * 0.42;
        slot.vx = (Math.random() - 0.5) * 2.2;
        slot.vz = (Math.random() - 0.5) * 1.4;
        slot.vy = (slot.peakY - slot.y) / flightTime + 0.5 * 5.2 * flightTime;
        slot.paletteIdx = Math.floor(Math.random() * palettes.length);
        slot.trailTimer = 0;
      }

      function burstRocket(r) {
        const pal = palettes[r.paletteIdx % palettes.length];
        const cA = pal[0], cB = pal[1];
        const count = 65 + Math.floor(Math.random() * 26);
        const style = r.paletteIdx;
        const speedBase = 4.8 + Math.random() * 3.4;

        for (let k = 0; k < count; k++) {
          const u = Math.random() * 2 - 1;
          const phi = Math.random() * Math.PI * 2;
          const sinTheta = Math.sqrt(Math.max(0, 1 - u * u));
          const dx = sinTheta * Math.cos(phi);
          const dy = u;
          const dz = sinTheta * Math.sin(phi);

          const isInner = style === 1 && k % 3 === 0;
          const spd = speedBase * (isInner ? 0.58 : (0.78 + Math.random() * 0.38));
          const col = k % 4 === 0 ? cB : cA;
          const isWillow = style === 0;
          const starLife = isWillow ? (1.9 + Math.random() * 0.9) : (1.25 + Math.random() * 0.75);
          const starSize = isWillow ? 0.78 : (0.68 + Math.random() * 0.36);
          const starDrag = isWillow ? 2.1 : 1.55;

          spawnStar(
            r.x, r.y, r.z,
            dx * spd, dy * spd + 0.85, dz * spd,
            col.r, col.g, col.b,
            starLife, starSize, starDrag
          );
        }

        flashLight.position.set(r.x, r.y, r.z);
        flashLight.color.copy(cA);
        flashIntensity = 4.6;
      }

      function setActive(flag) {
        if (active === flag) return;
        active = flag;
        if (active) launchTimer = 0.04;
      }

      function setPixelRatio(pr) {
        mat.uniforms.uPixelRatio.value = pr;
      }

      function update(dt, elapsedSec) {
        if (active) {
          launchTimer -= dt;
          if (launchTimer <= 0) {
            const waveCount = Math.random() < 0.42 ? 2 : 1;
            for (let w = 0; w < waveCount; w++) launchRocket();
            launchTimer = 0.38 + Math.random() * 0.48;
          }
        }

        for (const r of rockets) {
          if (!r.active) continue;
          r.vy -= 5.2 * dt;
          r.x += r.vx * dt;
          r.y += r.vy * dt;
          r.z += r.vz * dt;
          r.trailTimer += dt;
          if (r.trailTimer >= 0.022) {
            r.trailTimer = 0;
            spawnStar(
              r.x + (Math.random() - 0.5) * 0.08,
              r.y,
              r.z + (Math.random() - 0.5) * 0.08,
              -r.vx * 0.15 + (Math.random() - 0.5) * 0.35,
              -0.6 - Math.random() * 0.6,
              -r.vz * 0.15 + (Math.random() - 0.5) * 0.35,
              1.0, 0.86, 0.52,
              0.38 + Math.random() * 0.22,
              0.52,
              1.0
            );
          }
          if (r.vy <= 0.6 || r.y >= r.peakY) {
            r.active = false;
            burstRocket(r);
          }
        }

        let dirty = false;
        for (let i = 0; i < MAX_STARS; i++) {
          if (life[i] <= 0) continue;
          dirty = true;
          life[i] -= dt;
          if (life[i] <= 0) {
            positions[i * 3 + 1] = -999;
            sizes[i] = 0;
            continue;
          }
          const k = life[i] / maxLife[i];
          const damp = Math.max(0, 1 - drag[i] * dt);
          vel[i * 3] *= damp;
          vel[i * 3 + 1] = vel[i * 3 + 1] * damp - 2.65 * dt;
          vel[i * 3 + 2] *= damp;
          positions[i * 3] += vel[i * 3] * dt;

            colors[i * 3 + 2] *= (1 - dt * 0.96);
          }
        }
        if (dirty) {
          posAttr.needsUpdate = true;
          colAttr.needsUpdate = true;
          sizeAttr.needsUpdate = true;
        }

        if (flashIntensity > 0.01) {
          flashIntensity *= Math.max(0, 1 - dt * 5.2);

        const wingSpread = isFlying ? (0.32 + boostGlow * 0.28) : 0.15;

        robot.rightWing.rotation.y = wingSpread - wingFlap;

        robot.rightWing.rotation.z = isFlying ? 0.14 + boostGlow * 0.16 : 0;

        const walkBlend = isWalkingNow ? 1 : 0;
        const phase = t * 3.2;
        const swingL = Math.sin(phase) * walkBlend;
        const swingR = -swingL;
        const hipPitchL = isFlying ? 0.22 + Math.sin(t * 2.4) * 0.04 : -swingL * 0.34;
        const hipPitchR = isFlying ? 0.28 - Math.sin(t * 2.4) * 0.04 : -swingR * 0.34;
        const kneeBendL = isFlying ? 0.26 : (isWalkingNow ? Math.max(0.06, Math.cos(phase) * 0.52 + (swingL > 0 ? 0.14 : 0.05)) : 0.04);
        const kneeBendR = isFlying ? 0.34 : (isWalkingNow ? Math.max(0.06, -Math.cos(phase) * 0.52 + (swingR > 0 ? 0.14 : 0.05)) : 0.04);

        robot.leftHip.rotation.set(hipPitchL, 0, isFlying ? -0.04 : 0);
        robot.leftKnee.rotation.set(kneeBendL, 0, 0);
        robot.leftAnkle.rotation.set(isFlying ? 0.42 : (isWalkingNow ? -(hipPitchL + kneeBendL) * 0.85 + Math.max(0, -swingL) * 0.12 : -0.04), 0, 0);

        robot.rightHip.rotation.set(hipPitchR, 0, isFlying ? 0.04 : 0);
        robot.rightKnee.rotation.set(kneeBendR, 0, 0);
        robot.rightAnkle.rotation.set(isFlying ? 0.42 : (isWalkingNow ? -(hipPitchR + kneeBendR) * 0.85 + Math.max(0, -swingR) * 0.12 : -0.04), 0, 0);

        const stanceHip = Math.abs(hipPitchL) < Math.abs(hipPitchR) ? hipPitchL : hipPitchR;
        const liftComp = isFlying ? Math.sin(t * 3.1) * 0.035 : (isWalkingNow ? (1 - Math.cos(stanceHip)) * 0.44 + (1 - Math.abs(Math.cos(phase))) * 0.022 : 0.0);
        robot.pelvis.position.set(isWalkingNow ? Math.cos(phase) * 0.025 : 0, PELVIS_REST_Y + liftComp, 0);
        robot.pelvis.rotation.set(isFlying ? 0.14 : 0, isWalkingNow ? swingL * 0.06 : 0, isWalkingNow ? Math.cos(phase) * 0.022 : 0);

        if (state.mode === 'carry_walk' || state.mode === 'placing' || (isFlying && cakeRoot.parent === robot.cakeCarryAnchor)) {
          const placeLean = state.mode === 'placing' ? Math.sin(state.placeProgress * Math.PI) * 0.24 : (isFlying ? 0.06 : 0.04);
          const lowerArms = state.mode === 'placing' ? smooth01(state.placeProgress) * 0.24 : 0;

          robot.torso.rotation.set(placeLean, isWalkingNow ? -swingL * 0.05 : 0, isWalkingNow ? -Math.cos(phase) * 0.02 : 0);
          robot.leftShoulder.rotation.set(-0.34 - lowerArms * 0.35, 0.14, -0.18);
          robot.leftElbow.rotation.set(-1.20 + lowerArms * 0.55, 0.0, 0.14);
          robot.leftWrist.rotation.set(-0.28 + lowerArms * 0.25, 0.18, -0.06);

          robot.rightShoulder.rotation.set(-0.34 - lowerArms * 0.35, -0.14, 0.18);
          robot.rightElbow.rotation.set(-1.20 + lowerArms * 0.55, 0.0, -0.14);
          robot.rightWrist.rotation.set(-0.28 + lowerArms * 0.25, -0.18, 0.06);

          applyHandGesture(robot.leftFingers, 0.25);
          applyHandGesture(robot.rightFingers, 0.25);

          const carryFloat = isWalkingNow ? Math.sin(phase * 2.0) * 0.010 : (isFlying ? Math.sin(t * 4.0) * 0.006 : 0);
          robot.cakeCarryAnchor.position.set(0, 0.222 + carryFloat, 0.72);
          robot.cakeCarryAnchor.rotation.set(-robot.torso.rotation.x * 0.9, -(robot.pelvis.rotation.y + robot.torso.rotation.y) * 0.6, -(robot.pelvis.rotation.z + robot.torso.rotation.z) * 0.9);
          robot.head.rotation.set(isFlying ? -0.10 : (-0.03 + placeLean * 0.2), 0, Math.cos(phase) * 0.015 * walkBlend);
        } else if (isFlying) {
          robot.torso.rotation.set(0.08, 0, 0);
          robot.leftShoulder.rotation.set(-0.18, 0, -0.45 - Math.sin(t * 4.5) * 0.08);
          robot.leftElbow.rotation.set(-0.35, 0, -0.1);
          robot.leftWrist.rotation.set(0, 0.2, 0);
          robot.rightShoulder.rotation.set(-0.18, 0, 0.45 + Math.sin(t * 4.5) * 0.08);
          robot.rightElbow.rotation.set(-0.35, 0, 0.1);
          robot.rightWrist.rotation.set(0, -0.2, 0);
          applyHandGesture(robot.leftFingers, 0.1);
          applyHandGesture(robot.rightFingers, 0.1);
          robot.head.rotation.set(-0.14, 0, Math.sin(t * 2.2) * 0.04);
        } else if (state.mode === 'idle_happy') {
          const b = Math.sin(t * 2.1);
          robot.torso.rotation.set(b * 0.02, 0, 0);
          robot.leftShoulder.rotation.set(0.06, 0, -0.26 - b * 0.02);
          robot.leftElbow.rotation.set(-0.28, 0, 0);
          robot.leftWrist.rotation.set(0, 0.3, 0);
          robot.rightShoulder.rotation.set(0.06, 0, 0.26 + b * 0.02);
          robot.rightElbow.rotation.set(-0.28, 0, 0);
          robot.rightWrist.rotation.set(0, -0.3, 0);
          applyHandGesture(robot.leftFingers, 0.2);
          applyHandGesture(robot.rightFingers, 0.2);
          robot.head.rotation.set(b * 0.03, 0.05 * Math.sin(t * 1.1), Math.sin(t * 1.3) * 0.04);
        } else if (state.mode === 'wave_happy') {
          const w = Math.sin(t * 5.2);
          robot.torso.rotation.set(0.03, 0.08, 0.04);
          robot.leftShoulder.rotation.set(-0.56, 0, -1.08 + w * 0.14);
          robot.leftElbow.rotation.set(-0.88, 0, -0.28 + w * 0.20);
          robot.leftWrist.rotation.set(0, 0.35, 0);
          robot.rightShoulder.rotation.set(0.10, 0, 0.26);
          robot.rightElbow.rotation.set(-0.32, 0, 0);
          robot.rightWrist.rotation.set(0, -0.35, 0);
          applyHandGesture(robot.leftFingers, 0.0);
          applyHandGesture(robot.rightFingers, 0.35);
          robot.head.rotation.set(-0.04, -0.06, -0.10 + Math.sin(t * 2.8) * 0.04);
        }

        // Candle flame animation & blow-out smoke
        flameEnvelope += ((isCandleLit ? 1.0 : 0.0) - flameEnvelope) * Math.min(1, dt * 10.0);
        micWindLean = Math.max(0, micWindLean - dt * 2.2);
        if (flameEnvelope > 0.008) {
          flameGroup.visible = true;
          const flicker = Math.sin(t * 14.0) * 0.042 + Math.sin(t * 23.5 + 1.2) * 0.026 + micWindLean * 0.18 * Math.sin(t * 36.0);
          const swayX = Math.sin(t * 3.6) * 0.05 + micWindLean * 0.65;
          const swayZ = Math.cos(t * 2.9) * 0.04 - micWindLean * 0.48;
          const sY = (1.0 + flicker * 1.35) * flameEnvelope * (1 - micWindLean * 0.25);
          const sXZ = (1.0 - flicker * 0.42) * flameEnvelope;
          outerFlameMesh.scale.set(sXZ, sY, sXZ);
          outerFlameMesh.rotation.set(swayZ, 0, swayX);
          innerFlameMesh.scale.set(0.56 * sXZ, 0.64 * sY, 0.56 * sXZ);
          innerFlameMesh.rotation.set(swayZ * 0.7, 0, swayX * 0.7);
          const hs = (0.95 + flicker * 0.55) * flameEnvelope;
          flameHaloSprite.scale.set(hs, hs * 1.24, 1);
          flameHaloSprite.material.opacity = (0.65 + flicker * 0.35) * flameEnvelope;
          candleLight.intensity = Math.max(0, (1.1 + flicker * 1.4) * flameEnvelope);
        } else {
          flameGroup.visible = false;
          candleLight.intensity = 0;
        }

        if (emberGlow > 0.01) {
          emberGlow = Math.max(0, emberGlow - dt * 0.55);
          wickTipMesh.visible = true;
          wickTipMesh.material.color.setRGB(emberGlow, emberGlow * 0.25, emberGlow * 0.05);
        } else if (!isCandleLit) {
          wickTipMesh.visible = false;
        }

        for (let i = smokeParticles.length - 1; i >= 0; i--) {
          const p = smokeParticles[i];
          if (p.delay > 0) { p.delay -= dt; continue; }
          p.age += dt;
          const pr = p.age / p.life;
          if (pr >= 1) {
            scene.remove(p.sprite); p.sprite.material.dispose(); smokeParticles.splice(i, 1); continue;
          }
          p.sprite.position.y += p.vy * dt;
          p.sprite.position.x += (p.vx + Math.sin(p.age * 3.1 + p.phase) * 0.025) * dt;
          p.sprite.position.z += (p.vz + Math.cos(p.age * 2.5 + p.phase) * 0.025) * dt;
          const sc = p.startScale + pr * 0.14;
          p.sprite.scale.set(sc, sc, 1);
          p.sprite.material.opacity = 0.46 * Math.min(1, pr * 5) * Math.pow(1 - pr, 1.6);
        }
      }

      return {
        robot,
        cakeRoot,
        candleHitbox,
        state,
        extinguishCandle,
        resetCandle,
        setCutProgress,
        isLit: () => isCandleLit,
        setWind: (v) => { micWindLean = Math.max(micWindLean, v); },
        update
      };
    }

    // =========================================================================
    // 8. FIRST-PERSON POV RIGHT HAND + CAKE KNIFE (from hand.html, r169 migrated)
    // =========================================================================
    function createPovCuttingHandSystem(camera) {
      function createHealthySkinTextures() {
        const size = 512;
        const diffCanvas = document.createElement('canvas'); diffCanvas.width = diffCanvas.height = size;
        const ctx = diffCanvas.getContext('2d');
        const baseGrad = ctx.createLinearGradient(0, 0, 0, size);
        baseGrad.addColorStop(0.00, '#e1b192'); baseGrad.addColorStop(0.45, '#e3b395');
        baseGrad.addColorStop(0.73, '#e5b698'); baseGrad.addColorStop(0.87, '#e2ab90'); baseGrad.addColorStop(1.00, '#da957e');
        ctx.fillStyle = baseGrad; ctx.fillRect(0, 0, size, size);
        for (let i = 0; i < 240; i++) {
          const x = Math.random() * size, y = Math.random() * size, r = 10 + Math.random() * 26;
          const g = ctx.createRadialGradient(x, y, 2, x, y, r);
          g.addColorStop(0, Math.random() < 0.55 ? 'rgba(218, 149, 126, 0.04)' : 'rgba(250, 224, 205, 0.035)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        const diffTex = new THREE.CanvasTexture(diffCanvas);
        diffTex.colorSpace = THREE.SRGBColorSpace;
        diffTex.wrapS = diffTex.wrapT = THREE.RepeatWrapping;

        const bumpCanvas = document.createElement('canvas'); bumpCanvas.width = bumpCanvas.height = size;
        const bCtx = bumpCanvas.getContext('2d');
        bCtx.fillStyle = '#808080'; bCtx.fillRect(0, 0, size, size);
        for (let i = 0; i < 3500; i++) {
          const s = 123 + Math.floor(Math.random() * 10);
          bCtx.fillStyle = `rgb(${s},${s},${s})`;
          bCtx.fillRect(Math.random() * size, Math.random() * size, 1.4, 1.4);
        }
        const bumpTex = new THREE.CanvasTexture(bumpCanvas);
        bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
        return { diffTex, bumpTex };
      }

      function createNaturalNailTexture() {
        const w = 256, h = 256, c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#eec5b9'); g.addColorStop(0.24, '#f5ccc2'); g.addColorStop(0.79, '#efbfb3'); g.addColorStop(0.87, '#fbf7f2'); g.addColorStop(1, '#f7f1ea');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      function createPearlIvoryTexture() {
        const size = 256, c = document.createElement('canvas'); c.width = c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, size, size);
        g.addColorStop(0, '#fcf8f2'); g.addColorStop(0.5, '#f2eadc'); g.addColorStop(1, '#fdfaf5');
        ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
        const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
