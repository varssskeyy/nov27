      }

      const skinTex = createHealthySkinTextures();
      const nailTex = createNaturalNailTexture();

      // Three.js r169 migrated MeshPhysicalMaterial (no deprecated `skinning: true`, updated `sheen`)
      const skinMat = new THREE.MeshPhysicalMaterial({
        map: skinTex.diffTex,
        bumpMap: skinTex.bumpTex,
        bumpScale: 0.0005,
        roughness: 0.52,
        metalness: 0.0,
        sheen: 0.35,
        sheenColor: new THREE.Color(0xffbfa5),
        sheenRoughness: 0.65,
        clearcoat: 0.06,
        clearcoatRoughness: 0.48
      });
      const nailMat = new THREE.MeshPhysicalMaterial({
        map: nailTex, roughness: 0.11, metalness: 0.02, clearcoat: 0.94, clearcoatRoughness: 0.06
      });

      function smoothStep01(x, e0, e1) {
        const t = THREE.MathUtils.clamp((x - e0) / (e1 - e0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      const Z_SHOULDER = 0.04, Z_ELBOW = -0.280, Z_MID_ARM = -0.390, Z_WRIST = -0.525, Z_PALM_MID = -0.573, Z_KNUCKLES = -0.618;
      const upperArmBone = new THREE.Bone();
      const elbowBone = new THREE.Bone(); elbowBone.position.set(0, 0, Z_ELBOW); upperArmBone.add(elbowBone);
      const twistBone = new THREE.Bone(); twistBone.position.set(0, 0, Z_MID_ARM - Z_ELBOW); elbowBone.add(twistBone);
      const wristBone = new THREE.Bone(); wristBone.position.set(0, 0, Z_WRIST - Z_MID_ARM); twistBone.add(wristBone);
      const palmBone = new THREE.Bone(); palmBone.position.set(0, 0, Z_PALM_MID - Z_WRIST); wristBone.add(palmBone);

      const segsZ = 84, segsR = 32, positions = [], uvs = [], skinIndices = [], skinWeights = [], indices = [];
      for (let iz = 0; iz <= segsZ; iz++) {
        const uZ = iz / segsZ, z = THREE.MathUtils.lerp(Z_SHOULDER, Z_KNUCKLES, uZ);
        let rx, ry, cy = 0, flatBack = 0, palmT = 0;
        if (z >= Z_ELBOW) {
          const t = (Z_SHOULDER - z) / (Z_SHOULDER - Z_ELBOW), sw = Math.sin(t * Math.PI) * 0.0052;
          rx = THREE.MathUtils.lerp(0.050, 0.036, t) + sw * 0.45; ry = THREE.MathUtils.lerp(0.052, 0.037, t) + sw * 0.85;
        } else if (z >= Z_WRIST) {
          const t = (Z_ELBOW - z) / (Z_ELBOW - Z_WRIST), fc = Math.sin(Math.pow(t, 0.74) * Math.PI) * 0.0072;
          rx = THREE.MathUtils.lerp(0.036, 0.0242, t) + fc * 0.82; ry = THREE.MathUtils.lerp(0.037, 0.0158, t) + fc * 0.68;
          flatBack = THREE.MathUtils.lerp(0, 0.12, smoothStep01(t, 0.72, 1));
        } else {
          palmT = (Z_WRIST - z) / (Z_WRIST - Z_KNUCKLES);
          const wc = smoothStep01(palmT, 0, 0.84), kt = 1 - 0.11 * Math.pow(Math.max(0, palmT - 0.84) / 0.16, 2);
          rx = THREE.MathUtils.lerp(0.0242, 0.0382, wc) * kt; ry = THREE.MathUtils.lerp(0.0158, 0.0118, palmT);
          cy = -Math.sin(palmT * Math.PI) * 0.0020; flatBack = 0.18 * Math.sin(palmT * Math.PI * 0.85);
        }
        const wE = smoothStep01(-z, -Z_ELBOW - 0.054, -Z_ELBOW + 0.054);
        const wT = smoothStep01(-z, -Z_MID_ARM - 0.088, -Z_MID_ARM + 0.088);
        const wW = smoothStep01(-z, -Z_WRIST - 0.026, -Z_WRIST + 0.026);
        const wP = smoothStep01(-z, -Z_PALM_MID - 0.020, -Z_PALM_MID + 0.020);
        const pairs = [[0, 1 - wE], [1, wE * (1 - wT)], [2, wE * wT * (1 - wW)], [3, wE * wT * wW * (1 - wP)], [4, wE * wT * wW * wP]]
          .sort((a, b) => b[1] - a[1]).slice(0, 4);
        const sum = pairs.reduce((a, b) => a + b[1], 0) || 1;
        for (let ir = 0; ir <= segsR; ir++) {
          const uR = ir / segsR, th = uR * Math.PI * 2, ct = Math.cos(th), st = Math.sin(th);
          let x = Math.sign(ct) * Math.pow(Math.abs(ct), 0.90) * rx;
          let y = cy + Math.sign(st) * Math.pow(Math.abs(st), 0.94) * ry;
          if (st > 0 && flatBack > 0) y -= flatBack * ry * st * st;
          if (palmT > 0.90) y = cy + (y - cy) * Math.cos(((palmT - 0.90) / 0.10) * Math.PI * 0.46);
          positions.push(x, y, z); uvs.push(uR, THREE.MathUtils.lerp(0, 0.80, uZ));
          skinIndices.push(pairs[0][0], pairs[1][0], pairs[2][0], pairs[3][0]);
          skinWeights.push(pairs[0][1] / sum, pairs[1][1] / sum, pairs[2][1] / sum, pairs[3][1] / sum);
        }
      }
      const rSize = segsR + 1;
      for (let iz = 0; iz < segsZ; iz++) for (let ir = 0; ir < segsR; ir++) {
        const a = iz * rSize + ir, b = (iz + 1) * rSize + ir;
        indices.push(a, a + 1, b, b, a + 1, b + 1);
      }
      const armGeo = new THREE.BufferGeometry();
      armGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      armGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      armGeo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
      armGeo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));
      armGeo.setIndex(indices); armGeo.computeVertexNormals();

      const armMesh = new THREE.SkinnedMesh(armGeo, skinMat);
      armMesh.castShadow = true; armMesh.frustumCulled = false;
      armMesh.add(upperArmBone);
      armMesh.bind(new THREE.Skeleton([upperArmBone, elbowBone, twistBone, wristBone, palmBone]));

      const root = new THREE.Group();
      root.position.set(0.205, -0.172, 0.04);
      root.visible = false;
      camera.add(root);
      root.add(armMesh);

      function buildFinger(spec, isThumb) {
        const fg = new THREE.Group(); fg.position.copy(spec.pos); fg.rotation.copy(spec.baseRot);
        const [L1, L2, L3] = spec.lengths, tot = L1 + L2 + L3;
        const b0 = new THREE.Bone(), b1 = new THREE.Bone(), b2 = new THREE.Bone();
        b1.position.set(0, 0, -L1); b2.position.set(0, 0, -L2); b0.add(b1); b1.add(b2);
        const fPos = [], fUv = [], fSi = [], fSw = [], fIdx = [], sz = 32, sr = 18;
        for (let iz = 0; iz <= sz; iz++) {
          const z = THREE.MathUtils.lerp(0.011, -tot, iz / sz), d = -z, frac = THREE.MathUtils.clamp(d / tot, 0, 1);
          let rx = THREE.MathUtils.lerp(spec.rBase, spec.rTip, Math.pow(frac, 0.86)), ry = rx * THREE.MathUtils.lerp(0.93, 0.80, frac);
          if (frac > 0.89) { const dome = Math.sqrt(Math.max(0.0005, 1 - Math.pow((frac - 0.89) / 0.11, 2) * 0.98)); rx *= dome; ry *= dome; }
          const w1s = smoothStep01(d, L1 - 0.007, L1 + 0.007), w2s = smoothStep01(d, L1 + L2 - 0.006, L1 + L2 + 0.006);
          for (let ir = 0; ir <= sr; ir++) {

            fPos.push(Math.cos(th) * rx, Math.sin(th) * ry, z); fUv.push(uR, THREE.MathUtils.lerp(0.76, 1, frac));
            fSi.push(0, 1, 2, 0); fSw.push(1 - w1s, w1s * (1 - w2s), w1s * w2s, 0);

        }

        fGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fUv, 2));

        fGeo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(fSw, 4));

        fg.add(fMesh);

        nail.position.set(0, spec.rTip * 0.72, -L3 * 0.52); b2.add(nail);
        palmBone.add(fg);
        return { bones: [b0, b1, b2], isThumb };
      }

      const dzK = Z_KNUCKLES - Z_PALM_MID;
      const digits = {
        index: buildFinger({ pos: new THREE.Vector3(-0.0268, 0.0008, dzK + 0.002), baseRot: new THREE.Euler(0, 0.032, 0.015), lengths: [0.041, 0.026, 0.022], rBase: 0.0085, rTip: 0.0056 }, false),
        middle: buildFinger({ pos: new THREE.Vector3(-0.0082, 0.0020, dzK - 0.001), baseRot: new THREE.Euler(0, 0.004, 0), lengths: [0.046, 0.029, 0.023], rBase: 0.0088, rTip: 0.0058 }, false),
        ring: buildFinger({ pos: new THREE.Vector3(0.0108, 0.0008, dzK + 0.001), baseRot: new THREE.Euler(0, -0.022, -0.014), lengths: [0.042, 0.027, 0.022], rBase: 0.0081, rTip: 0.0054 }, false),
        pinky: buildFinger({ pos: new THREE.Vector3(0.0282, -0.0020, dzK + 0.008), baseRot: new THREE.Euler(0, -0.055, -0.036), lengths: [0.033, 0.021, 0.018], rBase: 0.0071, rTip: 0.0048 }, false),
        thumb: buildFinger({ pos: new THREE.Vector3(-0.028, -0.0076, 0.012), baseRot: new THREE.Euler(-0.14, 0.56, 0.56), lengths: [0.033, 0.028, 0.024], rBase: 0.0108, rTip: 0.0069 }, true)
      };

      // Silver & Pearl-Ivory Cake Knife in right palm
      const knife = new THREE.Group();
      const silverMat = new THREE.MeshPhysicalMaterial({ color: 0xf4f7fa, metalness: 0.96, roughness: 0.08, clearcoat: 0.6 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xd9b672, metalness: 0.88, roughness: 0.22 });
      const pearlMat = new THREE.MeshPhysicalMaterial({ color: 0xfaf5ec, map: createPearlIvoryTexture(), roughness: 0.20, clearcoat: 0.88 });
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.002, 0.022, 0.215), silverMat);
      blade.position.set(0, 0, -0.159); blade.castShadow = true; knife.add(blade);
      const bolster = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.008, 0.014, 16), goldMat);
      bolster.rotation.x = Math.PI / 2; bolster.position.set(0, 0, -0.047); knife.add(bolster);
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.010, 0.104, 18), pearlMat);
      handle.rotation.x = Math.PI / 2; handle.position.set(0, 0, 0.011); knife.add(handle);
      knife.position.set(-0.005, -0.020, -0.018);
      knife.rotation.set(-0.08, 0.08, 0.92);
      palmBone.add(knife);

      const cur = {
        upperArm: new THREE.Vector3(-1.32, 0.16, -0.08),
        elbow: new THREE.Vector3(THREE.MathUtils.degToRad(40), 0.12, 0),
        twist: -0.5,
        wrist: new THREE.Vector3(0.04, 0.06, 0),
        digits: {
          index: [0.42, 0.28, 0.16, -0.02], middle: [1.04, 1.12, 0.52, 0],
          ring: [1.12, 1.18, 0.58, 0.01], pinky: [1.16, 1.16, 0.60, 0.02], thumb: [0.34, 0.26, 0.18, -0.32, -0.16]
        }
      };

      // Celebratory golden sparkle burst when slice completes
      const sparkleCount = 24;
      const spGeo = new THREE.BufferGeometry();
      const spPos = new Float32Array(sparkleCount * 3);
      spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
      const spMat = new THREE.PointsMaterial({ color: 0xffdf88, size: 0.045, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const spPoints = new THREE.Points(spGeo, spMat);
      spPoints.frustumCulled = false;
      const spVel = [];
      for (let i = 0; i < sparkleCount; i++) spVel.push(new THREE.Vector3());
      let spAge = 99;

      function triggerSparkles(worldPos) {
        if (!spPoints.parent && camera.parent) camera.parent.add(spPoints);
        spAge = 0;
        for (let i = 0; i < sparkleCount; i++) {
          spPos[i * 3] = worldPos.x; spPos[i * 3 + 1] = worldPos.y; spPos[i * 3 + 2] = worldPos.z;
          const a = Math.random() * Math.PI * 2, spd = 0.35 + Math.random() * 0.55;
          spVel[i].set(Math.cos(a) * spd, 0.55 + Math.random() * 0.65, Math.sin(a) * spd);
        }
        spGeo.attributes.position.needsUpdate = true;
      }

      function setFraming(isPortrait) {
        root.position.set(isPortrait ? 0.112 : 0.205, isPortrait ? -0.155 : -0.172, 0.04);
      }

      function update(cutT, dt, sliceCenterWorld, onSliceProgress, onDone) {
        // cutT: 0 -> 4.0s (rise 0..0.9 -> poise 0.9..1.35 -> slice+saw 1.35..2.85 -> lift & retract 2.85..4.0)
        const rise = smooth01(cutT / 0.9);
        const retract = cutT > 2.95 ? smooth01((cutT - 2.95) / 1.05) : 0;
        root.visible = cutT < 4.05;

        let cutElbowDelta = 0, cutShoulderDelta = 0, cutWristPitch = 0, sawMicro = 0;
        let sliceProgress = 0;
        if (cutT >= 0.9 && cutT < 1.35) {
          const k = smooth01((cutT - 0.9) / 0.45);
          cutElbowDelta = k * 0.14; cutShoulderDelta = k * 0.04; cutWristPitch = k * 0.08;
        } else if (cutT >= 1.35 && cutT < 2.85) {
          const k = smooth01((cutT - 1.35) / 1.50);
          sliceProgress = k;
          const env = Math.sin(k * Math.PI);
          sawMicro = Math.sin(k * Math.PI * 5.0) * 0.036 * env;
          cutElbowDelta = THREE.MathUtils.lerp(0.14, -0.34, k) + sawMicro;
          cutShoulderDelta = THREE.MathUtils.lerp(0.04, -0.11, k) + sawMicro * 0.4;
          cutWristPitch = THREE.MathUtils.lerp(0.08, -0.18, k) - sawMicro * 0.5;
        } else if (cutT >= 2.85) {
          sliceProgress = 1.0;
          const k = smooth01((cutT - 2.85) / 0.7);
          cutElbowDelta = THREE.MathUtils.lerp(-0.34, 0, k);
          cutShoulderDelta = THREE.MathUtils.lerp(-0.11, 0, k);
          cutWristPitch = THREE.MathUtils.lerp(-0.18, 0, k);
        }
        if (onSliceProgress && sliceProgress > 0) onSliceProgress(sliceProgress);

        const targetShoulderX = THREE.MathUtils.lerp(-1.35, -0.95 + cutShoulderDelta, rise * (1 - retract)) - retract * 0.42;
        const targetElbowX = THREE.MathUtils.lerp(THREE.MathUtils.degToRad(36), THREE.MathUtils.degToRad(72) + cutElbowDelta, rise * (1 - retract));

        const kS = 1 - Math.exp(-8.0 * dt), kW = 1 - Math.exp(-6.0 * dt);
        cur.upperArm.lerp(new THREE.Vector3(targetShoulderX, 0.25, -0.04), kS);
        cur.elbow.lerp(new THREE.Vector3(targetElbowX, 0.16, 0), kS);
        cur.twist += (-1.08 + sawMicro * 0.35 - cur.twist) * kW;
        cur.wrist.lerp(new THREE.Vector3(-0.08 + cutWristPitch, 0.14, 0), kW);

        upperArmBone.rotation.set(cur.upperArm.x, cur.upperArm.y, cur.upperArm.z);
        elbowBone.rotation.set(cur.elbow.x, cur.elbow.y, cur.elbow.z);
        twistBone.rotation.set(0, 0, cur.twist);
        wristBone.rotation.set(cur.wrist.x, cur.wrist.y, cur.wrist.z);

        ['index', 'middle', 'ring', 'pinky'].forEach((n) => {
          const c = cur.digits[n], d = digits[n];
          d.bones[0].rotation.set(-c[0], c[3], 0); d.bones[1].rotation.set(-c[1], 0, 0); d.bones[2].rotation.set(-c[2], 0, 0);
        });
        const tc = cur.digits.thumb;
        digits.thumb.bones[0].rotation.set(-tc[0], tc[3], tc[4]);
        digits.thumb.bones[1].rotation.set(-tc[1], 0, 0);
        digits.thumb.bones[2].rotation.set(-tc[2], 0, 0);

        if (cutT >= 1.65 && spAge > 10 && sliceCenterWorld) {
          triggerSparkles(sliceCenterWorld);
        }
        if (spAge < 1.5) {
          spAge += dt;
          for (let i = 0; i < sparkleCount; i++) {
            spVel[i].y -= 1.4 * dt;
            spPos[i * 3] += spVel[i].x * dt;
            spPos[i * 3 + 1] += spVel[i].y * dt;
            spPos[i * 3 + 2] += spVel[i].z * dt;
          }
          spGeo.attributes.position.needsUpdate = true;
          spMat.opacity = Math.max(0, 1 - spAge / 1.4);
        } else {
          spMat.opacity = 0;
        }
        if (cutT >= 4.05 && onDone) onDone();
      }

      return { root, setFraming, reset: () => { root.visible = false; spAge = 99; spMat.opacity = 0; }, update };
    }

    function applyTwilightBlend(k) {
      const t = Math.max(0, Math.min(1, k));
      sunLight.position.lerpVectors(ATM_DAY.sunPos, ATM_TWILIGHT.sunPos, t);
      const sunDir = sunLight.position.clone().normalize();
      sunLight.color.lerpColors(ATM_DAY.sunCol, ATM_TWILIGHT.sunCol, t);
      sunLight.intensity = THREE.MathUtils.lerp(ATM_DAY.sunInt, ATM_TWILIGHT.sunInt, t);
      hemiLight.color.lerpColors(ATM_DAY.hemiSky, ATM_TWILIGHT.hemiSky, t);
      hemiLight.groundColor.lerpColors(ATM_DAY.hemiGnd, ATM_TWILIGHT.hemiGnd, t);
      hemiLight.intensity = THREE.MathUtils.lerp(ATM_DAY.hemiInt, ATM_TWILIGHT.hemiInt, t);
      bounceLight.color.lerpColors(ATM_DAY.bounceCol, ATM_TWILIGHT.bounceCol, t);
      bounceLight.intensity = THREE.MathUtils.lerp(ATM_DAY.bounceInt, ATM_TWILIGHT.bounceInt, t);

      const su = skyDome.material.uniforms;
      su.uSunDir.value.copy(sunDir);
      su.uZenithColor.value.lerpColors(ATM_DAY.zenith, ATM_TWILIGHT.zenith, t);
      su.uHorizonColor.value.lerpColors(ATM_DAY.horizon, ATM_TWILIGHT.horizon, t);
      su.uSunColor.value.lerpColors(ATM_DAY.sunDiskCol, ATM_TWILIGHT.sunDiskCol, t);
      su.uGroundColor.value.lerpColors(ATM_DAY.groundCol, ATM_TWILIGHT.groundCol, t);
      su.uTwilightFactor.value = t;

      const ou = ocean.material.uniforms;
      ou.uSunDir.value.copy(sunDir);
      ou.uSunColor.value.copy(sunLight.color);
      ou.uSkyHorizon.value.copy(su.uHorizonColor.value);
      ou.uSkyZenith.value.copy(su.uZenithColor.value);
      ou.uDeepColor.value.lerpColors(ATM_DAY.oceanDeep, ATM_TWILIGHT.oceanDeep, t);
      ou.uShallowColor.value.lerpColors(ATM_DAY.oceanShallow, ATM_TWILIGHT.oceanShallow, t);
      ou.uFogColor.value.lerpColors(ATM_DAY.fogCol, ATM_TWILIGHT.fogCol, t);
      ou.uFogDensity.value = THREE.MathUtils.lerp(ATM_DAY.fogDens, ATM_TWILIGHT.fogDens, t);
      ou.uTwilightFactor.value = t;

      scene.fog.color.lerpColors(ATM_DAY.fogCol, ATM_TWILIGHT.fogCol, t);

    // =========================================================================

    const HW_DASH = 2200;
    function syncHandwrittenTitleLayout() {
      const words = String(FINAL_BIRTHDAY_TITLE || '').trim().split(/\s+/).filter(Boolean);

    syncHandwrittenTitleLayout();

    // Pre-pooled 2D bokeh + glowing pen-tip sparkle trail for Final Celebration Reveal
    const finaleBokehPool = Array.from({ length: 44 }, (_, i) => ({
      x: hash2D(i * 3.1, 1.7),
      y: hash2D(i * 5.7, 2.9),
      r: 8 + hash2D(i * 2.3, 8.1) * 28,
      vy: -(0.015 + hash2D(i * 4.9, 6.3) * 0.032),
      vx: (hash2D(i * 7.3, 4.1) - 0.5) * 0.016,
      hue: i % 3 === 0 ? '255, 198, 134' : (i % 3 === 1 ? '255, 152, 186' : '255, 236, 182'),
      alpha: 0.10 + hash2D(i * 9.1, 3.3) * 0.24,
      phase: hash2D(i * 6.1, 7.7) * 6.28
    }));

    const penSparkPool = Array.from({ length: 36 }, () => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, life: 0.7 }));
    let penSparkCursor = 0;

    function resetHandwritingAnimation() {
      hwLine1El.setAttribute('stroke-dashoffset', String(HW_DASH));
      hwLine2El.setAttribute('stroke-dashoffset', String(HW_DASH));
      hwLine1El.setAttribute('fill-opacity', '0');
      hwLine2El.setAttribute('fill-opacity', '0');

      btnFinaleReplay.style.opacity = '0';
      for (const s of penSparkPool) s.active = false;
    }

    function updateFinaleHandwriting(hwTime, dt) {
      // Pen draws line 1 (0..1.85s), then line 2 (1.55..3.20s), then fills ink & reveals subtitle + button
      const p1 = smooth01(hwTime / 1.85);
      const p2 = smooth01((hwTime - 1.55) / 1.65);
      const f1 = smooth01((hwTime - 1.15) / 1.10);
      const f2 = smooth01((hwTime - 2.35) / 1.05);

      hwLine1El.setAttribute('stroke-dashoffset', (HW_DASH * (1 - p1)).toFixed(1));
      hwLine2El.setAttribute('stroke-dashoffset', (HW_DASH * (1 - p2)).toFixed(1));
      hwLine1El.setAttribute('fill-opacity', f1.toFixed(3));
      hwLine2El.setAttribute('fill-opacity', f2.toFixed(3));

      const subAlpha = smooth01((hwTime - 3.15) / 0.85);
      const btnAlpha = smooth01((hwTime - 3.55) / 0.75);
      finaleSubtitleEl.style.opacity = subAlpha.toFixed(3);
      btnFinaleReplay.style.opacity = btnAlpha.toFixed(3);

      // Emit subtle golden pen-tip sparkles while writing strokes
      if (hwTime < 3.25) {
        let penX = 0.5, penY = 0.36;
        if (hwTime < 1.85) {
          penX = 0.24 + p1 * 0.52;
          penY = 0.34 + Math.sin(p1 * Math.PI * 5.0) * 0.025;
        } else {
          penX = 0.34 + p2 * 0.32;
          penY = 0.47 + Math.sin(p2 * Math.PI * 4.0) * 0.025;
        }
        const s = penSparkPool[penSparkCursor];
        penSparkCursor = (penSparkCursor + 1) % penSparkPool.length;
        s.active = true;
        s.x = penX; s.y = penY;
        s.vx = (Math.random() - 0.5) * 0.04;
        s.vy = -0.02 - Math.random() * 0.04;
        s.age = 0;
        s.life = 0.55 + Math.random() * 0.35;
      }
      for (const s of penSparkPool) {
        if (!s.active) continue;
        s.age += dt;
        if (s.age >= s.life) { s.active = false; continue; }
        s.x += s.vx * dt;
        s.y += s.vy * dt;
      }
    }

    function renderFinaleBokeh(dt, elapsedSec) {
      const cw = finaleBokehCanvas.width;
      const ch = finaleBokehCanvas.height;
      finaleBokehCtx.clearRect(0, 0, cw, ch);
      for (const b of finaleBokehPool) {
        b.y += b.vy * dt;
        b.x += b.vx * dt + Math.sin(elapsedSec * 0.6 + b.phase) * 0.004 * dt;
        if (b.y < -0.1) b.y = 1.1;
        if (b.x < -0.1) b.x = 1.1;
        if (b.x > 1.1) b.x = -0.1;
        const bx = b.x * cw;
        const by = b.y * ch;
        const rad = b.r * Math.max(1, cw / 900);
        const pulse = 0.72 + 0.28 * Math.sin(elapsedSec * 1.8 + b.phase);
        const g = finaleBokehCtx.createRadialGradient(bx, by, 0, bx, by, rad);
        g.addColorStop(0, `rgba(${b.hue}, ${(b.alpha * pulse).toFixed(3)})`);
        g.addColorStop(0.55, `rgba(${b.hue}, ${(b.alpha * 0.35 * pulse).toFixed(3)})`);
        g.addColorStop(1, `rgba(${b.hue}, 0)`);
        finaleBokehCtx.fillStyle = g;
        finaleBokehCtx.beginPath();
        finaleBokehCtx.arc(bx, by, rad, 0, Math.PI * 2);
        finaleBokehCtx.fill();
      }
      for (const s of penSparkPool) {
        if (!s.active) continue;
        const k = 1 - s.age / s.life;
        const sx = s.x * cw;
        const sy = s.y * ch;
        const sr = (3 + k * 7) * Math.max(1, cw / 900);
        const sg = finaleBokehCtx.createRadialGradient(sx, sy, 0, sx, sy, sr);
        sg.addColorStop(0, `rgba(255, 252, 232, ${(0.95 * k).toFixed(3)})`);
        sg.addColorStop(0.45, `rgba(255, 205, 112, ${(0.55 * k).toFixed(3)})`);
        sg.addColorStop(1, 'rgba(255, 170, 70, 0)');
        finaleBokehCtx.fillStyle = sg;
        finaleBokehCtx.beginPath();
        finaleBokehCtx.arc(sx, sy, sr, 0, Math.PI * 2);
        finaleBokehCtx.fill();
      }
    }

    const micState = {
      listening: false,
      stream: null,
      audioCtx: null,
      analyser: null,
      dataArray: null,
      sustainedSec: 0
    };

    function stopMicrophone() {
      micState.listening = false;
      micState.sustainedSec = 0;
      micMeterWrap.classList.remove('active');
      micBar.style.width = '0%';
      if (micState.stream) {
        micState.stream.getTracks().forEach((tr) => tr.stop());
        micState.stream = null;
      }
      if (micState.audioCtx) {
        try { micState.audioCtx.close(); } catch (_) {}
        micState.audioCtx = null;
      }
      micState.analyser = null;
      micState.dataArray = null;
    }

    function completeBlowOut() {
      if (!varenSystem.isLit()) return;
      stopMicrophone();
      varenSystem.extinguishCandle();
      btnBlow.classList.remove('visible');
      flow.stage = 'post_blow';
      flow.stageTime = 0;
    }

    async function handleBlowButtonClick() {
      if (flow.stage !== 'blow_prompt') return;
      if (micState.listening) {
        completeBlowOut();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        completeBlowOut();
        return;
      }
      try {
        blowLabel.textContent = 'Listening… Blow into your mic!';
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (flow.stage !== 'blow_prompt') {
          stream.getTracks().forEach((tr) => tr.stop());
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        const src = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);

        micState.stream = stream;
        micState.audioCtx = audioCtx;
        micState.analyser = analyser;
        micState.dataArray = new Uint8Array(analyser.frequencyBinCount);
        micState.listening = true;
        micState.sustainedSec = 0;
        micMeterWrap.classList.add('active');
      } catch (_) {
        completeBlowOut();
      }
    }

    function updateMicrophoneBlow(dt) {
      if (!micState.listening || !micState.analyser || !micState.dataArray) return;
      micState.analyser.getByteTimeDomainData(micState.dataArray);
      let sumSq = 0;
      for (let i = 0; i < micState.dataArray.length; i++) {
        const norm = (micState.dataArray[i] - 128) / 128;
        sumSq += norm * norm;
      }
      const rms = Math.sqrt(sumSq / micState.dataArray.length);
      const levelPct = Math.min(100, Math.round((rms / 0.16) * 100));
      micBar.style.width = `${levelPct}%`;

      if (rms > 0.055) {
        varenSystem.setWind(Math.min(1.0, rms * 8.0));
        micState.sustainedSec += dt;
        if (micState.sustainedSec >= 0.24) {
          completeBlowOut();
        }
      } else {
        micState.sustainedSec = Math.max(0, micState.sustainedSec - dt * 1.4);
      }
    }

    btnBlow.addEventListener('click', handleBlowButtonClick);

    // Player First-Person 360° Look & Beach Exploration State
    const PITCH_MIN = THREE.MathUtils.degToRad(-55);
    const PITCH_MAX = THREE.MathUtils.degToRad(68);
    const playerState = {
      x: 0.0,
      z: 2.2,
      vx: 0.0,
      vz: 0.0,
      yaw: 0.0,
      pitch: 0.14,
      bobPhase: 0.0,
      lookActive: false,
      lookPointerId: null,
      lastX: 0,
      lastY: 0,
      downX: 0,
      downY: 0,
      lastDragSec: -99,
      keys: Object.create(null),
      joyX: 0,
      joyY: 0,
      joyActive: false,
      joyPointerId: null
    };

    function isExplorationEnabled() {
      return flow.threeActive && (
        flow.stage === 'sky_descent' ||
        flow.stage === 'table_rise_twilight' ||
        flow.stage === 'place_cake' ||
        flow.stage === 'blow_prompt' ||
        flow.stage === 'post_blow' ||
        flow.stage === 'cut_prompt' ||
        flow.stage === 'dialogue'
      );
    }

    function updateJoystickVisibility() {
      const show = isExplorationEnabled();
      mobileJoystick.classList.toggle('visible', show);
      uiStageWrap.classList.toggle('with-joystick', show);
      if (!show) {
        playerState.joyActive = false;
        playerState.joyPointerId = null;
        playerState.joyX = 0;
        playerState.joyY = 0;
        joyKnob.style.transform = 'translate3d(0, 0, 0)';
      }
    }

    function updateJoystickFromPointer(clientX, clientY) {
      const rect = mobileJoystick.getBoundingClientRect();
      const cx = rect.left + rect.width * 0.5;
      const cy = rect.top + rect.height * 0.5;
      const maxR = Math.max(24, rect.width * 0.36);
      let dx = clientX - cx;
      let dy = clientY - cy;
      const len = Math.hypot(dx, dy);
      if (len > maxR) {
        dx = (dx / len) * maxR;
        dy = (dy / len) * maxR;
      }
      playerState.joyX = dx / maxR;
      playerState.joyY = -dy / maxR;
      joyKnob.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;
    }

    mobileJoystick.addEventListener('pointerdown', (e) => {
      if (!isExplorationEnabled()) return;
      e.stopPropagation();
      playerState.joyActive = true;
      playerState.joyPointerId = e.pointerId ?? 1;
      e.currentTarget?.setPointerCapture?.(e.pointerId);
      updateJoystickFromPointer(e.clientX, e.clientY);
    });
    mobileJoystick.addEventListener('pointermove', (e) => {
      if (!playerState.joyActive) return;
      if (e.pointerId !== undefined && playerState.joyPointerId !== null && e.pointerId !== playerState.joyPointerId) return;
      e.stopPropagation();
      updateJoystickFromPointer(e.clientX, e.clientY);
    });
    const endJoystick = (e) => {
      if (e.pointerId !== undefined && playerState.joyPointerId !== null && e.pointerId !== playerState.joyPointerId) return;
      playerState.joyActive = false;
      playerState.joyPointerId = null;
      playerState.joyX = 0;
      playerState.joyY = 0;
      joyKnob.style.transform = 'translate3d(0, 0, 0)';
    };
    mobileJoystick.addEventListener('pointerup', endJoystick);
    mobileJoystick.addEventListener('pointercancel', endJoystick);

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();

    threeContainer.addEventListener('pointerdown', (e) => {
      playerState.downX = e.clientX;
      playerState.downY = e.clientY;
      playerState.lastX = e.clientX;
      playerState.lastY = e.clientY;
      if (isExplorationEnabled()) {
        playerState.lookActive = true;
        playerState.lookPointerId = e.pointerId ?? 1;
        threeContainer.setPointerCapture?.(e.pointerId);
      }
    });

    threeContainer.addEventListener('pointermove', (e) => {
      targetMouseX = (e.clientX / Math.max(1, W) - 0.5) * 2.0;
      targetMouseY = (e.clientY / Math.max(1, H) - 0.5) * 2.0;

      if (playerState.lookActive && isExplorationEnabled()) {
        const dx = e.clientX - playerState.lastX;
        const dy = e.clientY - playerState.lastY;
        playerState.lastX = e.clientX;
        playerState.lastY = e.clientY;
        const sens = (W / Math.max(1, H) < 0.9) ? 0.0052 : 0.0038;
        playerState.yaw -= dx * sens;
        playerState.pitch = THREE.MathUtils.clamp(playerState.pitch - dy * sens, PITCH_MIN, PITCH_MAX);
        playerState.lastDragSec = performance.now() * 0.001;
      }

      if (flow.stage === 'blow_prompt') {
        const r = renderer.domElement.getBoundingClientRect();
        pointerNDC.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        raycaster.setFromCamera(pointerNDC, camera);
        threeContainer.classList.toggle('candle-hover', raycaster.intersectObject(varenSystem.candleHitbox, false).length > 0);
      } else {
        threeContainer.classList.remove('candle-hover');
      }
    });

    const endLookDrag = (e) => {
      if (playerState.lookActive) {
        playerState.lookActive = false;
        playerState.lookPointerId = null;
      }
      if (flow.stage !== 'blow_prompt') return;
      if (Math.hypot(e.clientX - playerState.downX, e.clientY - playerState.downY) > 7) return;
      const r = renderer.domElement.getBoundingClientRect();
      pointerNDC.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raycaster.setFromCamera(pointerNDC, camera);
      if (raycaster.intersectObject(varenSystem.candleHitbox, false).length > 0) completeBlowOut();
    };
    threeContainer.addEventListener('pointerup', endLookDrag);
    threeContainer.addEventListener('pointercancel', () => {
      playerState.lookActive = false;
      playerState.lookPointerId = null;
    });

    btnCut.addEventListener('click', () => {
      if (flow.stage !== 'cut_prompt') return;
      btnCut.classList.remove('visible');
      varenSystem.setCutProgress(0);
      flow.stage = 'cutting';
      flow.stageTime = 0;
      updateJoystickVisibility();
    });

    // Stage 8 Dialogue Typewriter State
    const dialogueState = {
      idx: 0,
      charFloat: 0
    };

    function showDialogueLine(index) {
      dialogueState.idx = index;
      dialogueState.charFloat = 0;
      const line = VAREN_DIALOGUE_LINES[index] || '';
      dialogueTextEl.textContent = '';
      dialogueCountEl.textContent = `${index + 1} / ${VAREN_DIALOGUE_LINES.length}`;
      btnDialogueNext.textContent = index >= VAREN_DIALOGUE_LINES.length - 1 ? 'Finish' : 'Next';
      varenSystem.state.mode = index % 2 === 0 ? 'wave_happy' : 'idle_happy';
      return line;
    }

    btnDialogueNext.addEventListener('click', () => {
      if (flow.stage !== 'dialogue') return;
      const fullLine = VAREN_DIALOGUE_LINES[dialogueState.idx] || '';
      if (dialogueState.charFloat < fullLine.length) {
        dialogueState.charFloat = fullLine.length;
        dialogueTextEl.textContent = fullLine;
        return;
      }
      if (dialogueState.idx + 1 < VAREN_DIALOGUE_LINES.length) {
        showDialogueLine(dialogueState.idx + 1);
      } else {
        // Trigger VAREN's space ascent -> double-blink finale!
        dialogueCard.classList.remove('visible');
        flow.stage = 'varen_ascend';
        flow.stageTime = 0;
        varenSystem.state.mode = 'wave_happy';
        updateJoystickVisibility();
      }
    });

    btnFinaleReplay.addEventListener('click', resetExperience);

    // =========================================================================
    // 11. 12-STAGE CINEMATIC TIMELINE & PORTRAIT-ADAPTIVE CAMERA CONTROLLER
    // =========================================================================
    camera.rotation.order = 'YXZ';

    function getFraming() {
      const aspect = W / Math.max(1, H);
      const isPortrait = aspect < 0.9;
      const targetFov = isPortrait ? THREE.MathUtils.clamp(62 - aspect * 4, 58, 62) : 44;
      const zBack = isPortrait ? 0.55 : 0.0;
      return { isPortrait, targetFov, zBack };
    }

    function aimAtTarget(target, dt, speed) {
      if (playerState.lookActive) return;
      const nowSec = performance.now() * 0.001;
      if (nowSec - playerState.lastDragSec < 1.15) return;
      const eyeY = getBeachHeight(playerState.x, playerState.z) + 1.62;
      const dx = target.x - playerState.x;
      const dy = target.y - eyeY;
      const dz = target.z - playerState.z;
      const horiz = Math.max(0.05, Math.hypot(dx, dz));
      const wantYaw = Math.atan2(-dx, -dz);
      const wantPitch = THREE.MathUtils.clamp(Math.atan2(dy, horiz), PITCH_MIN, PITCH_MAX);
      const a = Math.min(1, dt * speed);
      playerState.yaw = lerpAngle(playerState.yaw, wantYaw, a);
      playerState.pitch += (wantPitch - playerState.pitch) * a;
    }

    function updatePlayerMovement(dt, elapsedSec) {
      if (!isExplorationEnabled()) return;
      let moveX = playerState.joyX;
      let moveFwd = playerState.joyY;
      if (playerState.keys['KeyW'] || playerState.keys['ArrowUp']) moveFwd += 1;
      if (playerState.keys['KeyS'] || playerState.keys['ArrowDown']) moveFwd -= 1;
      if (playerState.keys['KeyD'] || playerState.keys['ArrowRight']) moveX += 1;
      if (playerState.keys['KeyA'] || playerState.keys['ArrowLeft']) moveX -= 1;

      const mag = Math.hypot(moveX, moveFwd);
      if (mag > 1) { moveX /= mag; moveFwd /= mag; }

      const speed = 2.8;
      const sinY = Math.sin(playerState.yaw);
      const cosY = Math.cos(playerState.yaw);
      const targetVx = (-sinY * moveFwd + cosY * moveX) * speed;
      const targetVz = (-cosY * moveFwd - sinY * moveX) * speed;

      const accel = 1 - Math.exp(-10 * dt);
      playerState.vx += (targetVx - playerState.vx) * accel;
      playerState.vz += (targetVz - playerState.vz) * accel;

      playerState.x += playerState.vx * dt;
      playerState.z += playerState.vz * dt;

      // Table collision cylinder (r = 1.45m)
      if (tableSystem.group.visible) {
        const dxT = playerState.x - TABLE_POS.x;
        const dzT = playerState.z - TABLE_POS.z;
        const dT = Math.hypot(dxT, dzT);
        if (dT < 1.45) {
          const nx = dT > 0.001 ? dxT / dT : 0;
          const nz = dT > 0.001 ? dzT / dT : 1;
          playerState.x = TABLE_POS.x + nx * 1.45;
          playerState.z = TABLE_POS.z + nz * 1.45;
        }
      }

      // Grounded VAREN collision cylinder (r = 0.85m)
      if (varenSystem.robot.root.visible && flow.stage !== 'sky_descent' && flow.stage !== 'varen_ascend') {
        const vp = varenSystem.robot.root.position;
        const dxV = playerState.x - vp.x;
        const dzV = playerState.z - vp.z;
        const dV = Math.hypot(dxV, dzV);
        if (dV < 0.85) {
          const nx = dV > 0.001 ? dxV / dV : 0;
          const nz = dV > 0.001 ? dzV / dV : 1;
          playerState.x = vp.x + nx * 0.85;
          playerState.z = vp.z + nz * 0.85;
        }
      }

      // Safe beach bounds (keep clear of deep ocean & terrain edge)
      playerState.x = THREE.MathUtils.clamp(playerState.x, -15.5, 15.5);
      playerState.z = THREE.MathUtils.clamp(playerState.z, -10.2, 16.0);

      const moveSpeed = Math.hypot(playerState.vx, playerState.vz);
      if (moveSpeed > 0.08) playerState.bobPhase += dt * (4.8 + moveSpeed * 1.6);

      const bobOffset = Math.sin(playerState.bobPhase) * 0.032 * Math.min(1, moveSpeed / speed);
      const eyeY = getBeachHeight(playerState.x, playerState.z) + 1.62 + bobOffset;
      flow.camPos.set(playerState.x, eyeY, playerState.z);
    }

    const flow = {
      stage: 'balcony_open',
      stageTime: 0,
      balconyElapsed: 0,
      threeActive: false,
      swappedToBeach: false,
      swappedToReturn: false,
      swappedToFinale: false,
      handwriteElapsed: 0,
      twilightBlend: 0,
      camPos: new THREE.Vector3(0, getBeachHeight(0, 2.2) + 1.62, 2.2),
      camLook: new THREE.Vector3(0, 2.8, -14.0)
    };

    // Pre-compile Three.js scene silently behind Stage 1 closed eyelids
    const initFrame = getFraming();
    playerState.z = 2.2 + initFrame.zBack;
    flow.camPos.set(playerState.x, getBeachHeight(playerState.x, playerState.z) + 1.62, playerState.z);
    camera.fov = initFrame.targetFov;
    camera.updateProjectionMatrix();
    camera.position.copy(flow.camPos);
    camera.rotation.set(playerState.pitch, playerState.yaw, 0, 'YXZ');
    applyTwilightBlend(0);
    renderer.render(scene, camera);

    function resetExperience() {
      stopMicrophone();
      const fr = getFraming();
      flow.stage = 'balcony_open';
      flow.stageTime = 0;
      flow.balconyElapsed = 0;
      flow.threeActive = false;
      flow.swappedToBeach = false;
      flow.swappedToReturn = false;
      flow.swappedToFinale = false;
      flow.handwriteElapsed = 0;
      flow.twilightBlend = 0;

      playerState.x = 0.0;
      playerState.z = 2.2 + fr.zBack;
      playerState.vx = 0;
      playerState.vz = 0;
      playerState.yaw = 0.0;
      playerState.pitch = 0.14;
      playerState.bobPhase = 0;
      playerState.lastDragSec = -99;
      playerState.lookActive = false;
      flow.camPos.set(playerState.x, getBeachHeight(playerState.x, playerState.z) + 1.62, playerState.z);

      blinkState.progress = 1.0;

      btnBlow.classList.remove('visible');
      blowLabel.textContent = 'Blow Out the Candle';
      btnCut.classList.remove('visible');
      dialogueCard.classList.remove('visible');
      finaleOverlay.classList.remove('visible');
      syncHandwrittenTitleLayout();
      resetHandwritingAnimation();

      tableSystem.group.visible = false;
      tableSystem.group.position.set(TABLE_POS.x, TABLE_BURIED_Y, TABLE_POS.z);
      tableSand.clear();
      stardustTrail.clear();
      fireworksSystem.clear();

      varenSystem.resetCandle();
      varenSystem.state.mode = 'sky_fly';
      varenSystem.state.placeProgress = 0;
      varenSystem.robot.root.visible = true;
      varenSystem.robot.root.scale.setScalar(VAREN_SCALE);
      varenSystem.robot.root.position.copy(VAREN_SKY_POS);
      varenSystem.robot.root.rotation.y = 0.0;

      povHandSystem.reset();
      povHandSystem.setFraming(fr.isPortrait);
      controls.enabled = false;
      applyTwilightBlend(0);

      threeContainer.style.display = 'block';
      updateJoystickVisibility();
      restoreBalconyCanvases();
      renderBlinkOverlay();
    }

    function handleResize() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      blinkCanvas.width = Math.max(1, Math.floor(W * DPR));
      blinkCanvas.height = Math.max(1, Math.floor(H * DPR));
      finaleBokehCanvas.width = Math.max(1, Math.floor(W * DPR));
      finaleBokehCanvas.height = Math.max(1, Math.floor(H * DPR));
      if (balconyActive) rebuildBalconyAssets();
      const fr = getFraming();
      camera.aspect = W / Math.max(1, H);
      camera.fov = fr.targetFov;
      camera.updateProjectionMatrix();
      povHandSystem.setFraming(fr.isPortrait);
      fireworksSystem.setPixelRatio(DPR);
      syncHandwrittenTitleLayout();
      renderer.setPixelRatio(DPR);
      renderer.setSize(W, H);
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('keydown', (e) => {
      if (e.code) playerState.keys[e.code] = true;
      if (e.key === 'r' || e.key === 'R') resetExperience();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code) playerState.keys[e.code] = false;
    });

    initBalconyWebGL();
    initMistPuffs();
    handleResize();

    let lastNow = performance.now();
    function tick(now) {
      requestAnimationFrame(tick);
      const dt = Math.min(0.05, Math.max(0.001, (now - lastNow) * 0.001));
      lastNow = now;
      flow.stageTime += dt;

      const fr = getFraming();
      if (Math.abs(camera.fov - fr.targetFov) > 0.05) {
        camera.fov += (fr.targetFov - camera.fov) * Math.min(1, dt * 6);
        camera.updateProjectionMatrix();
      }

      let isVarenWalking = false;
      let varenGlowBoost = 0.0;
      const elapsedSec = now * 0.001;

      if (flow.stage === 'balcony_open') {
        flow.balconyElapsed += dt;
        renderBalconyFrame(dt, flow.balconyElapsed);
        if (flow.stageTime < 0.35) {
          blinkState.progress = 1.0;
        } else {
          blinkState.progress = 1.0 - smooth01((flow.stageTime - 0.35) / 1.35);
        }
        if (flow.stageTime >= 2.5) {
          blinkState.progress = 0;
          flow.stage = 'balcony_view';
          flow.stageTime = 0;
        }
      } else if (flow.stage === 'balcony_view') {
        flow.balconyElapsed += dt;
        renderBalconyFrame(dt, flow.balconyElapsed);
        if (flow.stageTime >= 2.5) {
          flow.stage = 'transition_blink';
          flow.stageTime = 0;
        }
      } else if (flow.stage === 'transition_blink') {
        const t = flow.stageTime;
        if (t < 0.95) {
          flow.balconyElapsed += dt;
          renderBalconyFrame(dt, flow.balconyElapsed);
          blinkState.progress = smooth01(t / 0.95);
        } else if (t < 1.40) {
          blinkState.progress = 1.0;
          if (!flow.swappedToBeach) {
            flow.swappedToBeach = true;
            pauseBalconyCanvases();
            threeContainer.style.display = 'block';
            flow.threeActive = true;
            playerState.x = 0.0;
            playerState.z = 2.2 + fr.zBack;
            playerState.yaw = -0.10;
            playerState.pitch = 0.22;
            varenSystem.state.mode = 'sky_fly';
            varenSystem.robot.root.position.copy(VAREN_SKY_POS);
            updateJoystickVisibility();
          }
        } else {
          blinkState.progress = 1.0 - smooth01((t - 1.40) / 1.10);
          if (t >= 2.5) {
            blinkState.progress = 0;
            flow.stage = 'sky_descent';
            flow.stageTime = 0;
            updateJoystickVisibility();
          }
        }
      } else if (flow.stage === 'sky_descent') {
        // Stage 3: VAREN glides down from high distant sky carrying lit cake & trailing stardust
        const dur = 5.4;
        const rawP = Math.min(1, flow.stageTime / dur);
        const u = 1 - Math.pow(1 - rawP, 2.3);
        varenSystem.state.mode = 'sky_fly';
        varenGlowBoost = 0.75 * (1 - rawP * 0.45);

        const vx = THREE.MathUtils.lerp(VAREN_SKY_POS.x, VAREN_LAND_POS.x, u) + Math.sin(u * Math.PI) * 1.45;
        const vz = THREE.MathUtils.lerp(VAREN_SKY_POS.z, VAREN_LAND_POS.z, u);
        // Gentle hover cushion right before boots touch sand
        const baseY = THREE.MathUtils.lerp(VAREN_SKY_POS.y, VAREN_LAND_POS.y, u);
        const cushion = Math.sin(Math.pow(rawP, 2.0) * Math.PI) * 0.42;
        const vy = baseY + cushion;
        varenSystem.robot.root.position.set(vx, vy, vz);

        const targetYaw = Math.atan2(playerState.x - vx, playerState.z - vz) * 0.45;
        varenSystem.robot.root.rotation.y = lerpAngle(varenSystem.robot.root.rotation.y, targetYaw, Math.min(1, dt * 4));

        if (rawP < 0.94) {
          stardustTrail.emit(new THREE.Vector3(vx, vy + 1.05, vz - 0.25), 0.55, 3, 1.0);
        }

        aimAtTarget(new THREE.Vector3(vx, vy + 1.25, vz), dt, 2.4);

        if (flow.stageTime >= dur) {
          varenSystem.robot.root.position.copy(VAREN_LAND_POS);
          varenSystem.state.mode = 'carry_walk';
          flow.stage = 'table_rise_twilight';
          flow.stageTime = 0;
          tableSystem.group.visible = true;
        }
      } else if (flow.stage === 'table_rise_twilight') {
        // Stage 4: VAREN steps smoothly forward as Baroque table rises with falling sand & Evening Twilight (Sun + Moon)
        const dur = 3.2;
        const p = smooth01(flow.stageTime / dur);
        isVarenWalking = p < 0.78;
        varenSystem.state.mode = 'carry_walk';

        const walkSub = smooth01(p / 0.78);
        const vx = THREE.MathUtils.lerp(VAREN_LAND_POS.x, VAREN_PLACE_POS.x, walkSub);
        const vz = THREE.MathUtils.lerp(VAREN_LAND_POS.z, VAREN_PLACE_POS.z, walkSub);
        varenSystem.robot.root.position.set(vx, getBeachHeight(vx, vz), vz);
        varenSystem.robot.root.rotation.y = lerpAngle(varenSystem.robot.root.rotation.y, 0.0, Math.min(1, dt * 5));

        const curTableY = THREE.MathUtils.lerp(TABLE_BURIED_Y, TABLE_REST_Y, p);
        tableSystem.group.position.y = curTableY;

        if (p > 0.05 && p < 0.94) {
          tableSand.emit(
            tableSystem.group.position,
            curTableY + tableSystem.topY * TABLE_SCALE,
            tableSystem.topRadius * TABLE_SCALE,
            10
          );
        }

        flow.twilightBlend = p;
        applyTwilightBlend(p);

        aimAtTarget(new THREE.Vector3(0, TABLE_REST_Y + 1.15, TABLE_POS.z - 0.3), dt, 2.8);

        if (flow.stageTime >= dur) {
          tableSystem.group.position.y = TABLE_REST_Y;
          flow.twilightBlend = 1.0;
          applyTwilightBlend(1.0);
          varenSystem.state.mode = 'placing';
          varenSystem.state.placeProgress = 0;
          flow.stage = 'place_cake';
          flow.stageTime = 0;
        }
      } else if (flow.stage === 'place_cake') {
        // Stage 5: VAREN leans forward & sets cake on lace doily center, then steps aside
        const placeDur = 1.45;
        const stepAsideDur = 1.35;
        if (flow.stageTime < placeDur) {
          varenSystem.state.mode = 'placing';
          varenSystem.state.placeProgress = smooth01(flow.stageTime / placeDur);
        } else {
          if (varenSystem.cakeRoot.parent !== tableSystem.group) {
            tableSystem.group.attach(varenSystem.cakeRoot);
            varenSystem.cakeRoot.position.set(0, tableSystem.topY + 0.002, 0);
            varenSystem.cakeRoot.rotation.set(0, 0, 0);
          }
          const sp = smooth01((flow.stageTime - placeDur) / stepAsideDur);
          isVarenWalking = sp < 0.96;
          varenSystem.state.mode = sp < 0.96 ? 'idle_happy' : 'wave_happy';
          const sx = THREE.MathUtils.lerp(VAREN_PLACE_POS.x, VAREN_IDLE_POS.x, sp);
          const sz = THREE.MathUtils.lerp(VAREN_PLACE_POS.z, VAREN_IDLE_POS.z, sp);
          varenSystem.robot.root.position.set(sx, getBeachHeight(sx, sz), sz);
          varenSystem.robot.root.rotation.y = lerpAngle(varenSystem.robot.root.rotation.y, -0.34, Math.min(1, dt * 4));
        }

        aimAtTarget(new THREE.Vector3(0.20, TABLE_REST_Y + tableSystem.topY * TABLE_SCALE + 0.24, TABLE_POS.z), dt, 2.8);

        if (flow.stageTime >= placeDur + stepAsideDur) {
          varenSystem.state.mode = 'idle_happy';
          flow.stage = 'blow_prompt';
          flow.stageTime = 0;
          blowLabel.textContent = 'Blow Out the Candle';
          btnBlow.classList.add('visible');
        }
      } else if (flow.stage === 'blow_prompt') {
        updateMicrophoneBlow(dt);
        aimAtTarget(new THREE.Vector3(0.05, TABLE_REST_Y + tableSystem.topY * TABLE_SCALE + 0.28, TABLE_POS.z), dt, 2.2);
      } else if (flow.stage === 'post_blow') {
        if (flow.stageTime >= 1.0) {
          flow.stage = 'cut_prompt';
          flow.stageTime = 0;
          btnCut.classList.add('visible');
        }
      } else if (flow.stage === 'cut_prompt') {
        aimAtTarget(new THREE.Vector3(0.0, TABLE_REST_Y + tableSystem.topY * TABLE_SCALE + 0.20, TABLE_POS.z), dt, 2.2);
      } else if (flow.stage === 'cutting') {
        // Stage 7: Center camera cleanly over cake & POV knife (portrait/landscape adjusted)
        updateJoystickVisibility();
        const topWorldY = TABLE_REST_Y + tableSystem.topY * TABLE_SCALE;
        const cutPos = new THREE.Vector3(0.0, topWorldY + (fr.isPortrait ? 0.62 : 0.54), fr.isPortrait ? 1.48 : 1.12);
        const cutLook = new THREE.Vector3(0.0, topWorldY + 0.14, TABLE_POS.z);
        flow.camPos.lerp(cutPos, Math.min(1, dt * 4.2));
        flow.camLook.lerp(cutLook, Math.min(1, dt * 4.8));

        const sliceWorld = new THREE.Vector3(0, topWorldY + 0.30, TABLE_POS.z + 0.10);
        povHandSystem.update(
          flow.stageTime,
          dt,
          sliceWorld,
          (sp) => varenSystem.setCutProgress(sp),
          () => {
            flow.stage = 'dialogue';
            flow.stageTime = 0;
            // Transition smoothly back into exploration framing near table
            playerState.x = 0.25;
            playerState.z = 2.15 + fr.zBack;
            playerState.yaw = -0.18;
            playerState.pitch = 0.08;
            fireworksSystem.setActive(true);
            showDialogueLine(0);
            dialogueCard.classList.add('visible');
            updateJoystickVisibility();
          }
        );
      } else if (flow.stage === 'dialogue') {
        // Stage 8: Grand fireworks show across twilight sky + VAREN dialogue + free exploration
        fireworksSystem.setActive(true);
        aimAtTarget(new THREE.Vector3(VAREN_IDLE_POS.x * 0.72, VAREN_IDLE_POS.y + 1.42, VAREN_IDLE_POS.z), dt, 2.2);
        const fullLine = VAREN_DIALOGUE_LINES[dialogueState.idx] || '';
        if (dialogueState.charFloat < fullLine.length) {
          dialogueState.charFloat = Math.min(fullLine.length, dialogueState.charFloat + dt * 36);
          dialogueTextEl.textContent = fullLine.slice(0, Math.floor(dialogueState.charFloat));
        }
      } else if (flow.stage === 'varen_ascend') {
        // Stage 9: VAREN waves warmly, spreads wings, glows, and blasts upward into space trailing stardust
        const dur = 5.0;
        const t = flow.stageTime;
        if (t < 1.15) {
          const w = smooth01(t / 1.15);
          varenSystem.state.mode = 'wave_happy';
          varenGlowBoost = w * 1.15;
          aimAtTarget(new THREE.Vector3(VAREN_IDLE_POS.x, VAREN_IDLE_POS.y + 1.45, VAREN_IDLE_POS.z), dt, 3.0);
        } else {
          const u = Math.min(1, (t - 1.15) / 3.75);
          const accel = u * u * (0.35 + 0.65 * u);
          varenSystem.state.mode = 'sky_fly';
          varenGlowBoost = 1.4;
          const vy = VAREN_IDLE_POS.y + accel * 44.0;
          const vx = VAREN_IDLE_POS.x - u * 0.8;
          const vz = VAREN_IDLE_POS.z - u * 4.5;
          varenSystem.robot.root.position.set(vx, vy, vz);
          const shrink = THREE.MathUtils.lerp(VAREN_SCALE, 0.014, Math.pow(u, 1.35));
          varenSystem.robot.root.scale.setScalar(shrink);
          varenSystem.robot.root.visible = u < 0.98;

          if (u < 0.94) {
            stardustTrail.emit(new THREE.Vector3(vx, vy + 0.6 * shrink, vz), 0.45 * shrink + 0.12, 4, 1.2);
          }

          aimAtTarget(new THREE.Vector3(vx, vy + 1.2, vz), dt, 3.5);
        }

        if (t >= dur) {
          varenSystem.robot.root.visible = false;
          flow.stage = 'blink_to_balcony';
          flow.stageTime = 0;
        }
      } else if (flow.stage === 'blink_to_balcony') {
        // Stage 10: 2.5s blink back to Stage 1 Himalayan Balcony View
        const t = flow.stageTime;
        if (t < 0.95) {
          blinkState.progress = smooth01(t / 0.95);
        } else if (t < 1.40) {
          blinkState.progress = 1.0;
          if (!flow.swappedToReturn) {
            flow.swappedToReturn = true;
            fireworksSystem.clear();
            stardustTrail.clear();
            flow.threeActive = false;
            threeContainer.style.display = 'none';
            restoreBalconyCanvases();
          }
        } else {
          flow.balconyElapsed += dt;
          renderBalconyFrame(dt, flow.balconyElapsed);
          blinkState.progress = 1.0 - smooth01((t - 1.40) / 1.10);
          if (t >= 2.5) {
            blinkState.progress = 0;
            flow.stage = 'balcony_return';
            flow.stageTime = 0;
          }
        }
      } else if (flow.stage === 'balcony_return') {
        // Stage 11: Peaceful Himalayan balcony beat (~2.2s)
        flow.balconyElapsed += dt;
        renderBalconyFrame(dt, flow.balconyElapsed);
        if (flow.stageTime >= 2.2) {
          flow.stage = 'final_blink';
          flow.stageTime = 0;
        }
      } else if (flow.stage === 'final_blink') {
        // Stage 12: Final 2.5s blink -> Handwritten "Happy Birthday Varsh" Celebration Screen
        const t = flow.stageTime;
        if (t < 0.95) {
          flow.balconyElapsed += dt;
          renderBalconyFrame(dt, flow.balconyElapsed);
          blinkState.progress = smooth01(t / 0.95);
        } else if (t < 1.40) {
          blinkState.progress = 1.0;
          if (!flow.swappedToFinale) {
            flow.swappedToFinale = true;
            flow.handwriteElapsed = 0;
            pauseBalconyCanvases();
            syncHandwrittenTitleLayout();
            resetHandwritingAnimation();
            finaleOverlay.classList.add('visible');
          }
          renderFinaleBokeh(dt, elapsedSec);
        } else {
          flow.handwriteElapsed += dt;
          updateFinaleHandwriting(flow.handwriteElapsed, dt);
          renderFinaleBokeh(dt, elapsedSec);
          blinkState.progress = 1.0 - smooth01((t - 1.40) / 1.10);
          if (t >= 2.5) {
            blinkState.progress = 0;
            flow.stage = 'finale';
            flow.stageTime = 0;
          }
        }
      } else if (flow.stage === 'finale') {
        flow.handwriteElapsed += dt;
        updateFinaleHandwriting(flow.handwriteElapsed, dt);
        renderFinaleBokeh(dt, elapsedSec);
      }

      if (flow.threeActive) {
        updatePlayerMovement(dt, elapsedSec);

        skyDome.material.uniforms.uTime.value = elapsedSec;
        ocean.material.uniforms.uTime.value = elapsedSec;

        const pAttr = breezeParticles.geometry.attributes.position;
        for (let i = 0; i < pAttr.count; i++) {
          let px = pAttr.getX(i) + dt * 0.42, py = pAttr.getY(i) + Math.sin(elapsedSec * 0.8 + pPhases[i]) * dt * 0.08, pz = pAttr.getZ(i) + dt * 0.14;
          if (px > 19) px = -19; if (pz > 19 + CORRIDOR_CENTER_Z) pz = -19 + CORRIDOR_CENTER_Z; if (py < 0.25) py = 6.6;
          pAttr.setXYZ(i, px, py, pz);
        }
        pAttr.needsUpdate = true;

        tableSystem.update(elapsedSec, flow.twilightBlend);
        tableSand.update(dt, flow.twilightBlend);
        stardustTrail.update(dt);
        fireworksSystem.update(dt, elapsedSec);
        varenSystem.update(elapsedSec, dt, isVarenWalking, varenGlowBoost);

        if (flow.stage === 'cutting') {
          camera.position.copy(flow.camPos);
          camera.lookAt(flow.camLook);
        } else {
          camera.position.copy(flow.camPos);
          camera.rotation.set(playerState.pitch, playerState.yaw, 0, 'YXZ');
        }
        renderer.render(scene, camera);
      }

      renderBlinkOverlay();
    }

    requestAnimationFrame(tick);
  </script>
</body>
